[package]
name = "sakkhi-drive"
version = "0.1.0"
description = "Sakkhi Drive local storage companion"
authors = ["Sakkhi"]
edition = "2021"

[build-dependencies]
tauri-build = "~2.7.2"

[dependencies]
# Keep the framework and plugins on the current Tauri 2.12 release line.
# The 2.12 line includes the menu error variants referenced by the core menu module.
tauri = { version = "~2.12.3", features = [] }
tauri-plugin-dialog = "~2.8.2"
tauri-plugin-opener = "~2.7.1"
serde = { version = "~1.0.219", features = ["derive"] }
sysinfo = "=0.35.2"
sha2 = "=0.10.9"
uuid = { version = "~1.18.1", features = ["v4"] }
hostname = "=0.4.1"
