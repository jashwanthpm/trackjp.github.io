<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise | Quotation Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --panel-bg:#1a1815;
  --panel-bg-raised:#242018;
  --panel-bg-input:#2b261d;
  --panel-ink:#eee3cd;
  --panel-ink-dim:#a89d84;
  --panel-line:#3c352a;
  --panel-gold:#c9a15a;
  --panel-accent:#b5673a;
  --pv-bg:#cdb89d;
  --pv-header:#d9c7ac;
  --pv-card:#e9decb;
  --pv-ink:#2c2822;
  --pv-ink-soft:#4a4339;
  --pv-accent:#7d1f2b;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; font-family:'EB Garamond',serif; background:#0f0d0b; color:var(--panel-ink); }

/* ---------------- Top bar ---------------- */
.topbar{
  position:sticky; top:0; z-index:60;
  background:var(--panel-bg); color:#eee3cd;
  padding:11px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  border-bottom:1px solid var(--panel-line);
}
.topbar .title{ font-family:'Playfair Display',serif; font-weight:700; font-size:15px; margin-right:auto; }
.topbar button{
  background:#2a251e; color:#f2e8d5; border:1px solid #453e32; padding:8px 14px;
  border-radius:6px; font-family:'EB Garamond',serif; font-size:14px; cursor:pointer;
}
.topbar button:hover{ background:#3a3226; }
.topbar button.primary{ background:var(--pv-accent); border-color:var(--pv-accent); }
.topbar button.primary:hover{ background:#921d2b; }
.topbar .hint{ width:100%; font-size:12.5px; color:#b8ab8c; }
.toolbar-group { display:flex; gap:10px; border-right: 1px solid var(--panel-line); padding-right:15px; margin-right:5px; }

/* ---------------- Layout ---------------- */
.workspace{ display:flex; align-items:flex-start; min-height:calc(100vh - 54px); }

.left-panel{
  width:400px; min-width:340px; max-width:440px;
  background:var(--panel-bg); color:var(--panel-ink);
  height:calc(100vh - 54px); overflow-y:auto; position:sticky; top:54px;
  padding:18px 18px 60px;
  border-right:1px solid var(--panel-line);
}
.right-panel{ flex:1; padding:28px 20px 60px; display:flex; justify-content:center; background:#100e0b; min-height:calc(100vh - 54px); }

.lp-section{ margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--panel-line); }
.lp-section:last-child{ border-bottom:none; margin-bottom:6px; }
.lp-section h3{
  display:flex; align-items:center; gap:8px;
  font-family:'EB Garamond',serif; font-weight:600;
  margin:0 0 14px; text-transform:uppercase; font-size:12px; letter-spacing:.12em; color:var(--panel-gold);
}
.lp-section h3 .hicon{ width:15px; height:15px; flex-shrink:0; opacity:.9; }
.lp-section h3 .hicon svg{ width:15px; height:15px; fill:var(--panel-gold); display:block; }
.lp-section h3::after{ content:""; flex:1; height:1px; background:linear-gradient(to right, var(--panel-line), transparent); }

.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; color:var(--panel-ink-dim); margin-bottom:5px; letter-spacing:.01em; }
.subhint{ font-size:11.5px; color:#7d715a; line-height:1.5; margin:2px 0 8px; }

/* Uniform dark styling for every form control */
.left-panel input[type=text],
.left-panel input[type=number],
.left-panel textarea,
.left-panel select{
  width:100%; background:var(--panel-bg-input); border:1px solid #4a4231; color:var(--panel-ink);
  padding:8px 10px; border-radius:6px; font-family:'EB Garamond',serif; font-size:14.5px;
  appearance:none; -webkit-appearance:none;
}
.left-panel select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23c9a15a' d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat; background-position:right 8px center; background-size:16px; padding-right:30px;
}
.left-panel input:focus, .left-panel textarea:focus, .left-panel select:focus{
  outline:none; border-color:var(--panel-gold); box-shadow:0 0 0 3px rgba(201,161,90,.15);
}
.left-panel textarea{ resize:none; overflow:hidden; min-height:44px; line-height:1.5; }

.field input[type=color]{
  width:100%; height:36px; border:1px solid #4a4231; background:var(--panel-bg-input);
  padding:3px; cursor:pointer; border-radius:6px;
}
.row-inline{ display:flex; gap:10px; align-items:flex-end; }
.row-inline > div{ flex:1; }
.row-inline .grow{ flex:1; }
.swatch-row{ display:flex; gap:10px; }
.swatch-row .field{ flex:1; margin-bottom:0; }

.mini-btn{
  background:var(--panel-bg-raised); border:1px solid #4a4231; color:#e7dcc4; font-size:12px;
  padding:6px 10px; border-radius:5px; cursor:pointer; font-family:'EB Garamond',serif;
}
.mini-btn:hover{ background:#332c20; border-color:var(--panel-gold); color:var(--panel-gold); }
.mini-btn.danger{ color:#d98e88; }
.mini-btn.danger:hover{ background:#332119; border-color:#a85c56; color:#e9a29c; }
.add-btn-full{
  width:100%; margin-top:4px; padding:9px; border-radius:7px; border:1.5px dashed #5c5138;
  background:transparent; color:var(--panel-gold); font-family:'EB Garamond',serif; font-size:13.5px; cursor:pointer;
  letter-spacing:.01em;
}
.add-btn-full:hover{ background:rgba(201,161,90,.08); border-color:var(--panel-gold); }

.item-card{
  background:var(--panel-bg-raised); border:1px solid var(--panel-line); border-left:2.5px solid var(--panel-gold);
  border-radius:0 8px 8px 0; padding:11px 12px; margin-bottom:10px;
}
.item-card .item-top{ display:flex; gap:8px; margin-bottom:8px; }
.item-card .item-top select{ width:auto; flex:1; }
.item-card .item-top .remove{ flex-shrink:0; width:auto; }

.event-card{
  background:var(--panel-bg-raised); border:1px solid var(--panel-line); border-left:2.5px solid var(--pv-accent);
  border-radius:0 8px 8px 0; padding:13px; margin-bottom:14px;
}
.event-card .ev-top{ display:flex; gap:8px; margin-bottom:10px; }
.role-block{ background:#1f1b14; border:1px solid #342c1f; border-radius:7px; padding:9px; margin-bottom:9px; }
.role-block .rb-head{ display:flex; gap:6px; margin-bottom:7px; align-items:center; }
.role-block .rb-head input{ flex:1; }
.style-edit{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
.style-edit input[type=number]{ width:52px; flex-shrink:0; }
.style-edit input[type=text]{ flex:1; }

/* ---------------- Preview (the actual design) ---------------- */
.page{
  width:100%; max-width:680px; background:var(--pv-bg); padding:52px 54px 64px;
  border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.4); color:var(--pv-ink);
  font-family:'EB Garamond',serif;
}
.logo-block{ padding:30px 20px 20px; text-align:center; margin-bottom:6px; }
.logo-block img{ max-height:85px; max-width:90%; }
.logo-text{ font-family:'Playfair Display',serif; font-weight:800; font-size:60px; margin:0 0 14px; }

.divider-wrap{ padding:14px 0 4px; }
.divider-dots{ display:flex; align-items:center; justify-content:center; }
.divider-dots::before,.divider-dots::after{ content:""; height:2px; background:#6b6560; flex:1; max-width:230px; }
.divider-dots .dot{ width:9px; height:9px; border-radius:50%; background:#6b6560; margin:0 -2px; }
.divider-simple{ height:1.5px; background:#6b6560; width:70%; margin:0 auto; }
.divider-diamond{ display:flex; align-items:center; justify-content:center; gap:10px; }
.divider-diamond::before,.divider-diamond::after{ content:""; height:1.5px; background:#6b6560; flex:1; max-width:220px; }
.divider-diamond .diamond{ width:9px; height:9px; background:var(--pv-accent); transform:rotate(45deg); }
.divider-none{ height:0; }

.greeting{ text-align:center; font-style:italic; font-size:32px; margin:26px 0 16px; }
.intro{ text-align:center; font-size:20px; line-height:1.65; max-width:620px; margin:0 auto 36px; color:var(--pv-ink-soft); }
h2.section-title{ text-align:center; font-style:italic; font-weight:600; font-size:28px; margin:44px 0 24px; }

.card{ background:var(--pv-card); border-radius:16px; padding:22px 26px; margin-bottom:15px; display:flex; align-items:flex-start; gap:18px; }
.card .icon-wrap{ flex-shrink:0; width:28px; height:28px; margin-top:3px; }
.card .icon-wrap svg{ width:28px; height:28px; fill:#1c1a17; display:block; }
.card .text{ font-size:18.5px; line-height:1.55; flex:1; white-space:pre-wrap; }

.events-list{ display:flex; flex-direction:column; gap:16px; }
.event-row{ background:var(--pv-card); border-radius:16px; padding:22px 26px; }
.event-row .ev-name{ font-size:22px; font-weight:600; margin-bottom:14px; }
.roles-wrap{ display:flex; flex-wrap:wrap; gap:18px 30px; }
.role-view{ min-width:180px; }
.role-view .rlabel{ font-size:16px; font-weight:600; color:var(--pv-ink-soft); margin-bottom:8px; }
.style-view{ display:flex; align-items:center; gap:8px; font-size:17.5px; margin-bottom:6px; }
.style-view .ppl{ display:inline-flex; }
.style-view .ppl svg{ width:16px; height:16px; fill:#1c1a17; margin-right:-3px; }

.payments-block{ text-align:center; margin-bottom:40px; }
.payments-block .lead{ font-size:19px; color:var(--pv-ink-soft); margin-bottom:8px; }
.amount{ font-weight:600; font-size:48px; margin:8px 0 20px; }
.amount .currency{ font-size:36px; margin-right:4px; }
.terms-note{ font-size:18px; line-height:1.6; max-width:580px; margin:0 auto; color:var(--pv-ink-soft); white-space:pre-wrap; }

.account-box{ text-align:center; font-size:18.5px; line-height:1.9; margin-bottom:10px; }
.account-box b{ font-weight:600; }

.terms-list{ list-style:none; padding:0; margin:0; }
.term-item{ display:flex; gap:12px; font-size:18.5px; line-height:1.6; margin-bottom:16px; }
.term-item::before{ content:"•"; font-size:22px; line-height:1.3; }
.term-item span{ flex:1; white-space:pre-wrap; }

.thankyou{ text-align:center; font-family:'Playfair Display',serif; font-style:italic; letter-spacing:.08em; font-size:28px; margin-top:44px; }

@media print{
  /* Removes browser headers/footers (dates, page numbers, URLs) */
  @page { margin: 0mm; }
  
  /* Forces the browser to print colors and background graphics */
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
  
  /* Force the entire printed document to use the tan background, fixing the black bottom bleed */
  html, body { 
    background: var(--pv-bg) !important; 
    height: 100%;
  }
  
  .topbar, .left-panel { display: none !important; }
  
  .workspace, .right-panel { 
    background: var(--pv-bg) !important; 
    padding: 0 !important; 
    display: block; 
  }
  
  .page { 
    box-shadow: none; 
    margin: 0 auto; 
    max-width: 100%; 
    padding: 40px 30px !important; 
    border-radius: 0; 
    background: transparent !important;
  }

  /* Prevent blocks from being sliced in half across pages */
  .card, .event-row, .payments-block, .account-box, .logo-block, .term-item {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  
  /* Prevent section titles from sitting at the very bottom of a page */
  h2.section-title {
    page-break-inside: avoid;
    break-inside: avoid;
    page-break-after: avoid;
    break-after: avoid;
  }
}

@media (max-width:980px){
  .workspace{ flex-direction:column; }
  .left-panel{ width:100%; max-width:100%; height:auto; position:relative; top:0; max-height:60vh; }
  .right-panel{ width:100%; padding:20px 12px; }
  .page{ padding:34px 20px; max-width:100%; }
}
</style>

<body>

<div class="workspace">

</div>

<script>
/* ================= ICONS ================= */
const ICONS = {

  calendar: `<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><rect x="3" y="5" width="18" height="4" fill="#0e0c0a"/><rect x="6" y="12" width="3" height="3" fill="#e9decb"/><rect x="11" y="12" width="3" height="3" fill="#e9decb"/><rect x="16" y="12" width="3" height="3" fill="#e9decb"/></svg>`,
  location: `<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>`,
  package: `<svg viewBox="0 0 24 24"><path d="M12 2 3 6v12l9 4 9-4V6l-9-4zm0 2.2 6.3 2.8L12 9.8 5.7 7 12 4.2zM5 8.5l6 2.7v8.6l-6-2.7V8.5zm8 11.3v-8.6l6-2.7v8.6l-6 2.7z"/></svg>`,
  disc: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="#e9decb"/><circle cx="12" cy="12" r="1.1"/></svg>`,
  info: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><rect x="11" y="10" width="2" height="7" fill="#e9decb"/><rect x="11" y="6.5" width="2" height="2" fill="#e9decb"/></svg>`,
  clock: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l4 2.3" stroke="#e9decb" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`

const ICON_LABELS = {
  camera:'Camera (shoot coverage)', gallery:'Gallery (photos)', film:'Film reel (video)',
  harddrive:'Hard drive / RAW', cloud:'Cloud storage', server:'Server / backup',
  drone:'Drone', calendar:'Calendar / schedule', location:'Location', package:'Package / delivery',
  disc:'Disc', info:'Info note', clock:'Timeline / duration'
};
const PERSON_SVG = `<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;

function iconSelectHTML(selected, onchangeAttr){
  let opts = Object.keys(ICONS).map(k=>`<option value="${k}" ${k===selected?'selected':''}>${ICON_LABELS[k]}</option>`).join('');
  return `<select ${onchangeAttr}>${opts}</select>`;
}

/* ================= STATE ================= */
let state = null;

const DB_URL='https://smyupcjfusgduaoxqfvu.supabase.co';
const DB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNteXVwY2pmdXNnZHVhb3hxZnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NjA3MzIsImV4cCI6MjA5NTQzNjczMn0.pGg9ZIYWpZ70R_HNtRl7FHrzeUNA5vlZT6hNkjDzhqo';
function currentUser(){try{return JSON.parse(localStorage.getItem('currentUser')||sessionStorage.getItem('currentUser')||'null')}catch(e){return null}}
function storedAuthSession(){
 for(const store of [localStorage,sessionStorage]){
  for(let i=0;i<store.length;i++){const k=store.key(i);if(!k||!k.startsWith('sb-')||!k.endsWith('-auth-token'))continue;
   try{const raw=JSON.parse(store.getItem(k));const session=raw&&raw.currentSession?raw.currentSession:raw;if(session&&(session.access_token||session.refresh_token))return {store,key:k,raw,session,nested:!!(raw&&raw.currentSession)}}catch(e){}
  }
 }
 return null;
}
function sessionToken(){const s=storedAuthSession();if(s&&s.session.access_token)return s.session.access_token;const u=currentUser();return u&&(u.access_token||u.accessToken||u.token)||null}
function refreshTokenValue(){const s=storedAuthSession();if(s&&s.session.refresh_token)return s.session.refresh_token;const u=currentUser();return u&&(u.refresh_token||u.refreshToken)||null}
function tokenNeedsRefresh(t){try{const p=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return !!p.exp&&p.exp*1000<Date.now()+45000}catch(e){return false}}
async function refreshSession(){
 const rt=refreshTokenValue();if(!rt)return null;
 const res=await fetch(DB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:DB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt}),cache:'no-store'});
 const txt=await res.text();if(!res.ok)throw new Error(txt||'Session refresh failed');const next=JSON.parse(txt),s=storedAuthSession();
 if(s){if(s.nested)s.raw.currentSession=Object.assign({},s.raw.currentSession,next);else s.raw=Object.assign({},s.raw,next);s.store.setItem(s.key,JSON.stringify(s.raw))}
 try{for(const store of [localStorage,sessionStorage]){const raw=store.getItem('currentUser');if(!raw)continue;const u=JSON.parse(raw);if(u&&typeof u==='object'){if('access_token'in u)u.access_token=next.access_token;if('accessToken'in u)u.accessToken=next.access_token;if('token'in u)u.token=next.access_token;if(next.refresh_token&&'refresh_token'in u)u.refresh_token=next.refresh_token;store.setItem('currentUser',JSON.stringify(u))}}}catch(e){}
 return next.access_token;
}
function userId(){const u=currentUser();return u&&(u.id||u.user_id)}
function authHeaders(extra){const t=sessionToken();return Object.assign({'apikey':DB_KEY,'Authorization':'Bearer '+(t||DB_KEY),'Content-Type':'application/json'},extra||{})}
async function api(path,opts){
 if(!currentUser()||!userId())throw new Error('Please sign in to Sakkhi again before using Enterprise.');
 let token=sessionToken();if(!token)throw new Error('Your secure Supabase session was not found. Please sign in again to reconnect Enterprise.');
 if(tokenNeedsRefresh(token)&&refreshTokenValue()){try{token=await refreshSession()||token}catch(e){}}
 const options=opts||{};
 const send=()=>{const extra=Object.assign({},options.headers||{});delete extra.Authorization;delete extra.apikey;delete extra['Content-Type'];return fetch(DB_URL+'/rest/v1/'+path,Object.assign({cache:'no-store'},options,{headers:authHeaders(extra)}))};
 let res=await send();
 if((res.status===401||res.status===403)&&refreshTokenValue()){try{const fresh=await refreshSession();if(fresh)res=await send()}catch(e){}}
 const txt=await res.text();if(!res.ok){let detail=txt;try{const j=JSON.parse(txt);detail=j.message||j.msg||j.hint||txt}catch(e){}throw new Error(detail||('Request failed ('+res.status+')'))}
 return txt?JSON.parse(txt):null;
}

function enc(v){return encodeURIComponent(String(v==null?'':v))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ================= RENDER: PREVIEW ================= */
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderDivider(){
  if(state.divider==='dots') return `<div class="divider-wrap"><div class="divider-dots"><span class="dot"></span></div></div>`;
  if(state.divider==='simple') return `<div class="divider-wrap"><div class="divider-simple"></div></div>`;
  if(state.divider==='diamond') return `<div class="divider-wrap"><div class="divider-diamond"><span class="diamond"></span></div></div>`;
  return `<div class="divider-wrap"><div class="divider-none"></div></div>`;
}

function renderLogo(){
  if(state.logo.mode==='image' && state.logo.image){
    return `<img src="${state.logo.image}" alt="logo">`;
  }
  return `<div class="logo-text">${esc(state.logo.text)}</div>`;
}

function renderCards(list){
  return list.map(item => `
    <div class="card">
      <div class="icon-wrap">${ICONS[item.icon]||ICONS.info}</div>
      <div class="text">${esc(item.text)}</div>
    </div>`).join('');
}

function renderPeople(n){
  n = Math.max(0, parseInt(n)||0);
  let s='<span class="ppl">';
  for(let i=0;i<n;i++) s += PERSON_SVG;
  return s + '</span>';
}

function renderEvents(){
  return state.events.map(ev => `
    <div class="event-row">
      <div class="ev-name">${esc(ev.name)}</div>
      <div class="roles-wrap">
        ${ev.roles.map(r => `
          <div class="role-view">
            <div class="rlabel">${esc(r.roleName)}</div>
            ${r.styles.map(s => `<div class="style-view">${renderPeople(s.count)}<span>${esc(s.label)}</span></div>`).join('')}
          </div>
        `).join('')}
      </div>

}

function renderTerms(){

function handleLogoUpload(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { state.logo.image = e.target.result; renderPreview(); };
  reader.readAsDataURL(file);
}

/* ================= SAVE / LOAD SYSTEM ================= */
function saveProject() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  
  // Names the file based on the client name automatically
  let fileName = state.clientName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
  if(!fileName) fileName = "quotation";
  
  dlAnchorElem.setAttribute("download", fileName + "_workspace.json");
  dlAnchorElem.click();
}

function loadProject(input) {
  const file = input.files[0];
  if (!file) return;
  
  // Safeguard: Check if user accidentally uploaded a PDF
  if (file.name.toLowerCase().endsWith('.pdf')) {
    alert("Please select a Workspace file (.json) instead of a PDF.\\n\\nPDFs are for sending to clients. The .json files are your saved editable drafts.");
    input.value = "";
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const loadedState = JSON.parse(e.target.result);
      if (loadedState && loadedState.theme) {
        state = loadedState;
        renderPreview();
        renderLeftPanel();
      } else {
        alert("This doesn't look like a valid workspace file.");
      }
    } catch (err) {
      alert("Error reading file. Ensure you uploaded a .json file.");
    }
  };
  reader.readAsText(file);
  input.value = ""; // reset so you can load the same file again if needed
}

function resetAll(){
  if(confirm('Reset everything back to the original sample quotation? Your edits will be lost.')){
    state = sampleState();
    renderPreview();
    renderLeftPanel();
  }
}

if (crmClient) state.clientName = crmClient;
if (crmEvent || crmDate || crmLocation || crmRequirements) {
  const parts = [];
  if (crmEvent) parts.push(crmEvent);
  if (crmDate) parts.push('scheduled for ' + crmDate);
  if (crmLocation) parts.push('at ' + crmLocation);
  state.intro = 'Thank you for considering us. We have prepared this proposal for ' + parts.join(' ') + '. Please review the coverage, deliverables and terms below. We look forward to documenting your occasion.';
  if (crmEvent) {
    const roles = JSON.parse(JSON.stringify(state.events[0]?.roles || []));
    state.events = [{name: crmEvent + (crmDate ? ' · ' + crmDate : '') + (crmLocation ? ' · ' + crmLocation : ''), roles}];
  }
  if (crmRequirements) state.highlights = [{icon:'camera', text:'Enquiry details received from the studio CRM:\n' + crmRequirements}, ...state.highlights.slice(1)];
}
if (enterpriseMode && !crmParams.get('documentId')) {
  state.amount = '';
  if (!crmClient) state.clientName = '';
  if (!crmEvent && !crmRequirements) state.intro = 'Thank you for considering our photography studio. This proposal outlines the requested coverage, deliverables, and terms. Edit each section to match the client and event before sending.';
}
async function enterpriseRpc(name,args){
  const res=await fetch(DB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:authHeaders(),body:JSON.stringify(args||{}),cache:'no-store'});
  const txt=await res.text();if(!res.ok)throw new Error(txt||'Workspace setup failed');return txt?JSON.parse(txt):null;
}
async function loadEnterpriseDocument(){
  if(!enterpriseMode) return;
  if(!currentUser() || !userId() || !sessionToken()){ toast('Sign in to Sakkhi before saving to Enterprise.'); return; }
  try{
    enterpriseDocs = await getSetting('enterprise_documents', []);
    try{
      const workspaceId=await enterpriseRpc('enterprise_create_workspace',{workspace_name:'My Studio'});
      enterpriseClients = await api('enterprise_clients?select=*&workspace_id=eq.'+encodeURIComponent(workspaceId)+'&order=created_at.desc');
    }catch(clientError){ enterpriseClients = await getSetting('enterprise_clients', []); }
    const id = crmParams.get('documentId');
    if(id){
      currentEnterpriseDoc = enterpriseDocs.find(d=>d.id===id) || null;
      if(currentEnterpriseDoc){
        enterprisePaid=Number(currentEnterpriseDoc.paid||0);
        if(currentEnterpriseDoc.quotationState) state = JSON.parse(JSON.stringify(currentEnterpriseDoc.quotationState));
        else {
          state.clientName = currentEnterpriseDoc.clientName || '';
          state.amount = currentEnterpriseDoc.amount ? amountText(currentEnterpriseDoc.amount) : '';
          state.intro = currentEnterpriseDoc.notes || state.intro;
          if(currentEnterpriseDoc.title) state.events = [{name:currentEnterpriseDoc.title,roles:state.events[0]?.roles||[]}];
        }
      }
    }
    renderPreview();
    renderLeftPanel();
  }catch(e){ toast('Could not load Enterprise document: '+e.message); }
}
async function saveEnterpriseDocument(){
  if(!enterpriseMode){ toast('Open this designer from Enterprise to save to the register.'); return; }
  if(!currentUser() || !userId() || !sessionToken()){ toast('Please sign in again before saving to Enterprise.'); return; }
  const clientName=(state.clientName||'').trim();
  if(!clientName){ alert('Please enter the client name before saving.'); return; }
  const amount=amountNumber(state.amount);
  const oldId=crmParams.get('documentId');
  const existing=currentEnterpriseDoc || enterpriseDocs.find(d=>d.id===oldId);
  const type=(crmParams.get('docType') || (existing&&existing.type) || 'Quotation');
  const title=(state.events||[]).map(e=>e.name).filter(Boolean).join(' + ') || 'Photography coverage';
  const d={
    id:existing?existing.id:'doc_'+Date.now().toString(36),
    type:type,
    clientId:(enterpriseClients.find(c=>(c.name||'').toLowerCase()===clientName.toLowerCase())||{}).id||'',
    clientName:clientName,
    title:title,
    date:existing&&existing.date?existing.date:new Date().toISOString().slice(0,10),
    dueDate:existing&&existing.dueDate?existing.dueDate:'',
    amount:amount,
    paid:Math.max(0,Number(enterprisePaid)||0),
    status:existing?existing.status:'Draft',
    notes:proposalNotes(state),
    quotationState:JSON.parse(JSON.stringify(state)),
    updatedAt:new Date().toISOString()
  };
  const next=existing?enterpriseDocs.map(x=>x.id===d.id?d:x):[d,...enterpriseDocs];
  try{
    await setSetting('enterprise_documents',next);
    enterpriseDocs=next; currentEnterpriseDoc=d;
    if(!crmParams.get('documentId')){ crmParams.set('documentId',d.id); window.history.replaceState({},'',window.location.pathname+'?'+crmParams.toString()); }
    toast((type==='Invoice'?'Invoice':'Quotation')+' saved to Invoices & Dues.');
  }catch(e){ toast('Save failed: '+e.message); }
}
renderPreview();
renderLeftPanel();
if(enterpriseMode) loadEnterpriseDocument();

/* ================= SCROLL SYNC ================= */
let syncTimeout;
document.getElementById('leftPanel').addEventListener('scroll', function() {
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => {
    let closestSection = 'logo';
    let minDistance = Infinity;
    const sections = ['theme', 'logo', 'intro', 'highlights', 'notes', 'events', 'payments', 'account', 'deliverables', 'terms'];
    
    sections.forEach(sec => {
      const el = document.getElementById('lp-' + sec);
      if (el) {
        const distance = Math.abs(el.getBoundingClientRect().top - 54);
        if (distance < minDistance) {
          minDistance = distance;
          closestSection = sec;
        }
      }
    });
    
    const previewId = closestSection === 'theme' ? 'logo' : closestSection;
    const targetElement = document.getElementById('pv-' + previewId);
    
    if (targetElement) {
      const targetY = targetElement.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({top: targetY, behavior: 'smooth'});
    }
  }, 150); 
});
