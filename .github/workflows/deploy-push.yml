name: Deploy push notifications

# Runs automatically whenever the files below change, and you can also run it
# by hand: GitHub → Actions → "Deploy push notifications" → Run workflow.
on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-push.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: smyupcjfusgduaoxqfvu
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets are set
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN secret (see SETUP.md step 2)"; exit 1; }
          [ -n "${{ secrets.VAPID_PRIVATE_KEY }}" ] || { echo "::error::Add the VAPID_PRIVATE_KEY secret (see SETUP.md step 2)"; exit 1; }


      - name: Save the push keys as function secrets
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            VAPID_PUBLIC_KEY="BD8RkPD5_buDJqb0IumbKkgeLaP_-DqIjpWJgHqroxrswZtm5SRk6V96jTuAWfT9R_ReJNAiJ4XPSCC97Kapn-o" \
            VAPID_SUBJECT="mailto:jashwanthjp18@gmail.com" \
            VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}"

      - name: Deploy the send-push function
        run: supabase functions deploy send-push --project-ref "$PROJECT_REF"
