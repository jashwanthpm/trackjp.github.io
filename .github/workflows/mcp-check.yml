name: Sakkhi MCP checks
on:
  push:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-check.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify installed SDK and OAuth package exports
        run: |
          node --input-type=module -e "import { OAuthProvider } from '@cloudflare/workers-oauth-provider'; import { McpServer } from '@modelcontextprotocol/sdk/server/mcp.js'; import { WebStandardStreamableHTTPServerTransport } from '@modelcontextprotocol/sdk/server/webStandardStreamableHttp.js'; if (![OAuthProvider,McpServer,WebStandardStreamableHTTPServerTransport].every(x => typeof x === 'function')) process.exit(1); console.log('Required runtime exports exist')"
      - run: npm run check
      - run: node --test test/basic.test.js
      - name: Verify actual runtime imports and OAuth provider initialization
        run: node -e "import('./src/index.js').then(m => { if (!m.default || typeof m.default.fetch !== 'function') process.exit(1); console.log('MCP Worker entrypoint loaded'); })"
      - run: npx wrangler deploy --dry-run --outdir /tmp/sakkhi-mcp-build
