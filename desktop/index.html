<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Sakkhi Drive</title>
  <style>
    *{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;background:#050505;color:#eee;font-family:system-ui,sans-serif}
    #sakkhi-frame{width:100%;height:100%;border:0;background:#050505}
    #pairing{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#080808;padding:24px}
    #pairing[hidden]{display:none} .pair-card{width:min(440px,100%);padding:34px;border:1px solid #3a3022;border-radius:18px;background:#111;text-align:center;box-shadow:0 24px 80px #0009}
    .pair-kicker{font-size:11px;letter-spacing:.2em;color:#c9a96e;text-transform:uppercase}.pair-code{font-size:36px;letter-spacing:.16em;color:#f0d5a4;margin:24px 0;font-weight:650}
    .pair-btn{width:100%;padding:13px;border:0;border-radius:9px;background:#c9a96e;color:#111;font-weight:650;cursor:pointer}.pair-status{color:#aaa;font-size:13px;min-height:38px;line-height:1.5;margin:16px 0}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050505;color:#c9a96e;font-size:12px;letter-spacing:.12em;text-transform:uppercase;z-index:-1}
  </style>
</head>
<body>
  <div id="app">
    <div id="boot">Sakkhi Drive · Connecting</div>
    <iframe id="sakkhi-frame" src="https://sakkhi.co.in/app/" title="Sakkhi Shoot Management" allow="clipboard-read; clipboard-write"></iframe>
  </div>
  <div id="pairing" hidden><div class="pair-card"><div class="pair-kicker">Sakkhi Drive</div><h2 style="font-size:23px;margin:12px 0 6px">Connect this computer</h2><p style="color:#aaa;font-size:13px">Open Sakkhi in your browser and approve this one-time pairing.</p><div class="pair-code" id="pair-code">--------</div><div class="pair-status" id="pair-status">Preparing secure pairing…</div><button class="pair-btn" id="pair-open" disabled>Open Sakkhi in browser</button></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
