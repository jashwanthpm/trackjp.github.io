<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakkhi | Company Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0a0a;color:#e8e8e8}
    ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#c9a96e}
    .panel{background:#0f0f0f;border:1px solid #202020;border-radius:14px}
    .eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#777}
    .field{width:100%;background:#090909;border:1px solid #292929;border-radius:9px;padding:10px 12px;color:#eee;font-size:13px;outline:none}
    .field:focus{border-color:rgba(201,169,110,.65)}
    .muted{color:#858585}
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
  <main class="max-w-5xl mx-auto space-y-6">
    <header class="flex items-center justify-between border-b border-neutral-900 pb-4">
      <div>
        <h2 class="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
          <i class="ti ti-settings text-[#c9a96e]"></i> Company Settings
        </h2>
        <p class="text-xs text-neutral-500 mt-1">Set up your enterprise profile and studio preferences.</p>
      </div>
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-neutral-800 bg-neutral-950 text-xs font-medium text-neutral-400">
        <span class="w-2 h-2 rounded-full bg-[#c9a96e]"></span> Enterprise
      </div>
    </header>
    <section class="panel p-5 sm:p-6 max-w-3xl"><div class="mb-5"><h2 class="font-bold">Company profile</h2><p class="text-xs text-neutral-500 mt-1">These fields are a visual template and do not save yet.</p></div><form class="space-y-5" onsubmit="event.preventDefault(); alert('Settings form is a visual template. Save functionality will be added later.');"><div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><label class="block"><span class="eyebrow block mb-2">Company name</span><input class="field" placeholder="Your studio name"></label><label class="block"><span class="eyebrow block mb-2">Business email</span><input class="field" type="email" placeholder="studio@example.com"></label><label class="block"><span class="eyebrow block mb-2">Phone number</span><input class="field" placeholder="+91"></label><label class="block"><span class="eyebrow block mb-2">Website</span><input class="field" placeholder="https://"></label></div><label class="block"><span class="eyebrow block mb-2">Studio address</span><textarea class="field" rows="3" placeholder="Enter studio address"></textarea></label><div class="pt-2"><button class="px-4 py-2.5 rounded-lg bg-[#c9a96e] text-black text-sm font-bold" type="submit">Save settings (preview)</button></div></form></section>
  </main>
</body>
</html>
