<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Award-winning photographer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --transition-smooth: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #111;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUpIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUpIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .font-serif { font-family: 'Lora', serif; }

        /* Hide scrollbar completely */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Drag & Snap Scrolling */
        .scroll-container {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory; 
            cursor: grab; 
        }
        .scroll-container:active { cursor: grabbing; }
        .snap-item { scroll-snap-align: start; }

        /* Gallery Images */
        .img-wrapper {
            background: #f5f5f5;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .gallery-img {
            transition: transform var(--transition-smooth), filter var(--transition-smooth);
            will-change: transform;
            pointer-events: none;
        }

        /* Subtle cinematic hover */
        .img-wrapper:hover .gallery-img { 
            transform: scale(1.02); 
            filter: brightness(0.95);
        }

        /* Lightbox Mechanics */
        #lightbox {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        
        #lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        #lightbox-img {
            transform: scale(0.98);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
        }

        #lightbox.active #lightbox-img {
            transform: scale(1);
        }

        #lightbox-img.fade-out {
            opacity: 0;
            transform: scale(0.99);
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aaa;
            font-size: 13px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="antialiased selection:bg-gray-200 selection:text-black">

    <div class="w-full max-w-[1600px] mx-auto flex flex-col min-h-screen">
        
        <header class="pt-32 md:pt-48 pb-10 px-8 md:px-16 w-full shrink-0">
            <h1 class="text-[1.75rem] md:text-[2.1rem] text-[#222] font-serif tracking-tight leading-tight mb-1">Hugo Bellamy</h1>
            <p class="text-[1.1rem] md:text-[1.3rem] text-[#888] font-light tracking-wide">Award-winning photographer</p>
        </header>

        <main class="w-full relative select-none flex-grow min-h-[400px]">
            <div id="loader">Loading Gallery...</div>
            
            <div id="gallery-track" class="flex overflow-x-auto hide-scrollbar scroll-container gap-[6px] pl-8 md:pl-16 pr-8 md:pr-16 pb-8 opacity-0 transition-opacity duration-700">
                </div>
        </main>

        <footer class="mt-auto px-8 md:px-16 py-12 flex flex-col md:flex-row justify-between items-center text-[13px] text-[#999] w-full shrink-0">
            <div class="flex space-x-1 mb-4 md:mb-0">
                <a href="#" class="hover:text-black transition-colors duration-300">Privacy Policy</a>
                <span>,</span>
                <a href="#" class="hover:text-black transition-colors duration-300 ml-1">Accessibility Statement</a>
            </div>
            <div>
                &copy;2026 by Hugo Bellamy. Powered and secured by <a href="#" class="underline hover:text-black transition-colors duration-300">Wix</a>.
            </div>
        </footer>

    </div>

    <div id="lightbox" class="fixed inset-0 z-50 bg-white/95 flex items-center justify-center p-6 md:p-12">
        <button id="close-lightbox" class="absolute top-6 right-6 md:top-8 md:right-8 text-gray-400 hover:text-black transition-colors cursor-pointer z-50 p-2">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <button id="prev-btn" class="absolute left-2 md:left-6 top-1/2 -translate-y-1/2 text-gray-300 hover:text-black transition-colors cursor-pointer z-50 p-4">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button id="next-btn" class="absolute right-2 md:right-6 top-1/2 -translate-y-1/2 text-gray-300 hover:text-black transition-colors cursor-pointer z-50 p-4">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
        <img id="lightbox-img" src="" alt="Enlarged photography" class="max-w-full max-h-full object-contain shadow-[0_20px_50px_rgba(0,0,0,0.05)] relative z-40">
    </div>

    <script>
        // --- Fetch Images from Google Sheets (BULLETPROOF VERSION) ---
        async function fetchImages() {
            try {
                if(sheetUrl === 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQO4ZuRMwreAK-SqH1zRw9AZXAS8weEn6rrt-QpAADw5KELUIVHea4sldDO_RZWeevg2N-FSJPp0gwn/pub?output=csv') {
                    console.log("Please add your Google Sheet link!");
                    return;
                } 
                
                const response = await fetch(sheetUrl);
                const data = await response.text();
                
                // Split by new line (handles both Windows and Mac hidden formats)
                const rows = data.split(/\r?\n/).slice(1); 
                
                portfolioImages = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(cols.length >= 2 && cols[0].trim() !== "") {
                        return {
                            // The regex /["\r]/g aggressively removes quotes and hidden returns
                            thumb: cols[0].replace(/["\r]/g, '').trim(),
                            highRes: cols[1].replace(/["\r]/g, '').trim(),
                            alt: cols[2] ? cols[2].replace(/["\r]/g, '').trim() : "Portfolio Image"
                        };
                    }
                }).filter(Boolean);
                
                renderGallery();
            } catch (error) {
                loader.innerText = "Error loading gallery. Check your console.";
                console.error("Fetch Error:", error);
            }
        }

        // --- Fetch Images from Google Sheets ---
        async function fetchImages() {
            try {
                if(sheetUrl === 'YOUR_GOOGLE_SHEET_CSV_LINK_HERE') {
                    // Demo data if link isn't pasted yet
                    portfolioImages = [
                        { thumb: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=800&fit=crop", highRes: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=100&w=2000", alt: "Portrait" },
                        { thumb: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=800&fit=crop", highRes: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=100&w=2000", alt: "Fashion" }
                    ];
                } else {
                    const response = await fetch(sheetUrl);
                    const data = await response.text();
                    
                    const rows = data.split('\n').slice(1); // Remove header row
                    portfolioImages = rows.map(row => {
                        const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                        if(cols.length >= 2 && cols[0].trim() !== "") {
                            return {
                                thumb: cols[0].replace(/"/g, '').trim(),
                                highRes: cols[1].replace(/"/g, '').trim(),
                                alt: cols[2] ? cols[2].replace(/"/g, '').trim() : "Portfolio Image"
                            };
                        }
                    }).filter(Boolean);
                }
                renderGallery();
            } catch (error) {
                loader.innerText = "Error loading gallery. Check your Google Sheet link.";
                console.error(error);
            }
        }

        const renderGallery = () => {
            slider.innerHTML = ''; 
            
            portfolioImages.forEach((imgData, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'snap-item flex-none w-[260px] md:w-[320px] lg:w-[380px] aspect-[4/5] img-wrapper';
                wrapper.setAttribute('data-src', imgData.highRes);
                
                wrapper.innerHTML = `
                    <img src="${imgData.thumb}" alt="${imgData.alt}" class="gallery-img w-full h-full object-cover" draggable="false">
                `;

                wrapper.addEventListener('click', () => {
                    if (dragDistance > 5) return; 
                    currentIndex = index;
                    updateLightboxImage(currentIndex);
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden'; 
                });

                slider.appendChild(wrapper);
                wrappers.push(wrapper);
            });

            const endPadding = document.createElement('div');
            endPadding.className = 'flex-none w-[20px] md:w-[60px]';
            slider.appendChild(endPadding);

            loader.style.display = 'none';
            slider.classList.remove('opacity-0');
        };

        // Scroll Logic
        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            dragDistance = 0;
            slider.style.scrollSnapType = 'none'; 
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });

        slider.addEventListener('mouseleave', () => {
            isDown = false;
            slider.style.scrollSnapType = 'x mandatory';
        });

        slider.addEventListener('mouseup', () => {
            isDown = false;
            slider.style.scrollSnapType = 'x mandatory';
        });

        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; 
            slider.scrollLeft = scrollLeft - walk;
            dragDistance = Math.abs(x - startX);
        });

        // Lightbox Logic
        const updateLightboxImage = (index) => {
            lightboxImg.classList.add('fade-out');
            setTimeout(() => {
                lightboxImg.src = portfolioImages[index].highRes;
                lightboxImg.alt = portfolioImages[index].alt;
                lightboxImg.onload = () => lightboxImg.classList.remove('fade-out');
            }, 150); 
        };

        const showNextImage = (e) => {
            if (e) e.stopPropagation(); 
            currentIndex = (currentIndex + 1) % portfolioImages.length; 
            updateLightboxImage(currentIndex);
        };

        const showPrevImage = (e) => {
            if (e) e.stopPropagation(); 
            currentIndex = (currentIndex - 1 + portfolioImages.length) % portfolioImages.length; 
            updateLightboxImage(currentIndex);
        };

        nextBtn.addEventListener('click', showNextImage);
        prevBtn.addEventListener('click', showPrevImage);

        const closeLightbox = () => {
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; 
            setTimeout(() => {
                lightboxImg.src = '';
                lightboxImg.classList.remove('fade-out');
            }, 400); 
        };

        closeLightboxBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') showNextImage();
            if (e.key === 'ArrowLeft') showPrevImage();
        });

        fetchImages();
    </script>
</body>
</html>
