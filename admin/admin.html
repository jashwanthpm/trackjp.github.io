<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sakkhi | Admin Command Center</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: #e8e8e8; }
    .brand-serif { font-family: 'Cinzel', serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
  </style>
</head>
<body class="min-h-screen pb-10">

  <div id="access-denied" class="fixed inset-0 z-50 bg-[#050505] flex flex-col items-center justify-center p-4">
    <div class="w-16 h-16 bg-red-950/30 border border-red-900/50 rounded-full flex items-center justify-center text-red-500 text-3xl mb-4"><i class="ti ti-shield-lock"></i></div>
    <h1 class="text-xl font-bold text-white mb-2">Admin Access Required</h1>
    <p class="text-sm text-neutral-500 text-center max-w-xs mb-6">You must be logged in as the master administrator to view this page.</p>
    <button onclick="window.location.href='/'" class="px-6 py-2.5 bg-neutral-900 border border-neutral-800 text-white rounded-lg text-sm font-semibold hover:bg-neutral-800 transition">Return to Main App</button>
  </div>

  <div id="admin-dashboard" class="hidden">
    <header class="sticky top-0 z-40 backdrop-blur-md bg-[#0a0a0a]/90 border-b border-neutral-900 px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold text-[#c9a96e] brand-serif tracking-widest">SAKKHI</h1>
        <span class="px-2 py-0.5 rounded text-[9px] font-bold bg-red-950 text-red-400 border border-red-900 uppercase tracking-widest">Admin</span>
      </div>
      <button onclick="window.location.href='/'" class="text-xs font-semibold text-neutral-400 hover:text-white transition flex items-center gap-1.5"><i class="ti ti-arrow-left"></i> Exit Admin</button>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="admin-stats">
        <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-5">
          <div class="text-[10px] uppercase font-bold tracking-widest text-neutral-500 mb-1">Total Users</div>
          <div class="text-3xl font-bold text-white" id="stat-users">0</div>
        </div>
        <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-5">
          <div class="text-[10px] uppercase font-bold tracking-widest text-neutral-500 mb-1">Total Shoots Logged</div>
          <div class="text-3xl font-bold text-[#c9a96e]" id="stat-shoots">0</div>
        </div>
        <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-5">
          <div class="text-[10px] uppercase font-bold tracking-widest text-neutral-500 mb-1">Platform Revenue</div>
          <div class="text-3xl font-bold text-emerald-400" id="stat-revenue">₹0</div>
        </div>
      </div>

      <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl overflow-hidden">
        <div class="p-5 border-b border-neutral-900 flex items-center justify-between">
          <h2 class="text-lg font-bold text-white"><i class="ti ti-users text-[#c9a96e] mr-2"></i>User Database</h2>
          <div class="flex items-center gap-2 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-1.5">
            <i class="ti ti-search text-neutral-500 text-sm"></i>
            <input type="text" id="admin-search" placeholder="Search users..." class="bg-transparent text-sm border-none outline-none text-white placeholder-neutral-600 w-48" onkeyup="filterTable()">
          </div>
        </div>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead>
              <tr class="bg-neutral-950 border-b border-neutral-900 text-[10px] uppercase tracking-wider text-neutral-500">
                <th class="p-4 font-bold">User Details</th>
                <th class="p-4 font-bold">Business Info</th>
                <th class="p-4 font-bold">Subscription</th>
                <th class="p-4 font-bold text-right">Shoots</th>
                <th class="p-4 font-bold text-right">Total Value</th>
                <th class="p-4 font-bold text-right">Last Active</th>
              </tr>
            </thead>
            <tbody id="user-table-body" class="divide-y divide-neutral-900 text-sm">
              <tr><td colspan="6" class="p-8 text-center text-neutral-500"><i class="ti ti-loader animate-spin text-xl"></i> Loading data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script>
    // --- SECURITY CONFIGURATION ---
    const MASTER_ADMIN_EMAIL = 'jashwanthjp18@gmail.com'; 
    const SUPABASE_URL = 'https://smyupcjfusgduaoxqfvu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNteXVwY2pmdXNnZHVhb3hxZnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NjA3MzIsImV4cCI6MjA5NTQzNjczMn0.pGg9ZIYWpZ70R_HNtRl7FHrzeUNA5vlZT6hNkjDzhqo';
    
    let allUsers = [];

    // --- INITIALIZATION & SECURITY CHECK ---
    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
      
      if (!savedUser) return; // Stays on Access Denied
      
      const user = JSON.parse(savedUser);
      
      if (user.email === MASTER_ADMIN_EMAIL) {
        document.getElementById('access-denied').style.display = 'none';
        document.getElementById('admin-dashboard').classList.remove('hidden');
        fetchAdminData(user.token);
      }
    });

    // --- DATA FETCHING ---
    async function fetchAdminData(token) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/admin_user_overview?select=*`, {
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}` // Using Anon key since we granted public read access
          }
        });
        
        if (!res.ok) throw new Error('Failed to fetch user data');
        
        allUsers = await res.json();
        renderDashboard();
      } catch (error) {
        console.error(error);
        document.getElementById('user-table-body').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">Error loading data. Check console.</td></tr>`;
      }
    }

    // --- RENDER LOGIC ---
    function renderDashboard() {
      // Calculate Totals
      const totalUsers = allUsers.length;
      const totalShoots = allUsers.reduce((sum, u) => sum + Number(u.total_shoots_logged || 0), 0);
      const totalRev = allUsers.reduce((sum, u) => sum + Number(u.total_platform_revenue || 0), 0);
      
      document.getElementById('stat-users').innerText = totalUsers;
      document.getElementById('stat-shoots').innerText = totalShoots;
      document.getElementById('stat-revenue').innerText = '₹' + totalRev.toLocaleString('en-IN');

      renderTable(allUsers);
    }

    function renderTable(data) {
      const tbody = document.getElementById('user-table-body');
      
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-neutral-500">No users found on the platform.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(u => {
        const planBadge = u.is_plan_active === 'Yes' 
          ? `<span class="px-2 py-1 rounded text-[10px] font-bold bg-emerald-950/40 text-emerald-400 border border-emerald-900 uppercase">${u.plan_type}</span>`
          : `<span class="px-2 py-1 rounded text-[10px] font-bold bg-red-950/40 text-red-400 border border-red-900 uppercase">Expired / Free</span>`;
          
        const lastActiveDate = u.last_active_shoot ? new Date(u.last_active_shoot).toLocaleDateString('en-IN', {day: '2-digit', month: 'short', year: 'numeric'}) : 'Never';

        return `
          <tr class="hover:bg-neutral-900/50 transition">
            <td class="p-4">
              <div class="font-bold text-white">${u.full_name || 'No Name Setup'}</div>
              <div class="text-xs text-neutral-500 mt-0.5">${u.email}</div>
            </td>
            <td class="p-4">
              <div class="font-semibold text-neutral-300">${u.business_name || '—'}</div>
              <div class="text-xs text-neutral-500 mt-0.5">${u.phone_number || '—'}</div>
            </td>
            <td class="p-4">${planBadge}</td>
            <td class="p-4 text-right font-medium text-neutral-300">${u.total_shoots_logged}</td>
            <td class="p-4 text-right font-bold text-[#c9a96e]">₹${Number(u.total_platform_revenue).toLocaleString('en-IN')}</td>
            <td class="p-4 text-right text-xs text-neutral-500">${lastActiveDate}</td>
          </tr>
        `;
      }).join('');
    }

    // --- SEARCH LOGIC ---
    function filterTable() {
      const query = document.getElementById('admin-search').value.toLowerCase();
      const filtered = allUsers.filter(u => 
        (u.email || '').toLowerCase().includes(query) || 
        (u.full_name || '').toLowerCase().includes(query) ||
        (u.business_name || '').toLowerCase().includes(query)
      );
      renderTable(filtered);
    }
  </script>
</body>
</html>
