name: Sakkhi MCP checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-check.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify installed SDK and OAuth package exports
        run: |
          node --input-type=module -e "import { OAuthProvider } from '@cloudflare/workers-oauth-provider'; import { McpServer } from '@modelcontextprotocol/sdk/server/mcp.js'; import { WebStandardStreamableHTTPServerTransport } from '@modelcontextprotocol/sdk/server/webStandardStreamableHttp.js'; if (![OAuthProvider,McpServer,WebStandardStreamableHTTPServerTransport].every(x => typeof x === 'function')) process.exit(1); console.log('Required runtime exports exist')"
      - run: npm run check
      - run: node --test test/basic.test.js
      - name: Verify actual runtime imports and OAuth provider initialization
        run: node -e "import('./src/index.js').then(m => { if (!m.default || typeof m.default.fetch !== 'function') process.exit(1); console.log('MCP Worker entrypoint loaded'); })"
      - run: npx wrangler deploy --dry-run --outdir /tmp/sakkhi-mcp-build
      - name: Verify disabled-by-default Worker health endpoint
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/sakkhi-mcp-dev.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/health > /tmp/sakkhi-mcp-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/sakkhi-mcp-dev.log; exit 1; fi
          node --input-type=module -e "import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync('/tmp/sakkhi-mcp-health.json','utf8')); if(h.enabled !== false || h.writes !== false || h.oauth !== true) process.exit(1); console.log('Worker starts and is disabled by default')"
          status=$(curl --silent --output /tmp/sakkhi-mcp-response.json --write-out '%{http_code}' http://127.0.0.1:8787/mcp)
          test "$status" = 503
