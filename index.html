    function getDaysPending(shootDate) {
      const today = new Date();
      const shootDay = new Date(shootDate + 'T00:00:00');
      const diffMs = today - shootDay;
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      return Math.max(0, diffDays);
    }
    
    function getDaysPendingColor(days) {
      if (days <= 30) return 'text-emerald-400 bg-emerald-950/40';

    }

        console.error('Session check error:', error);
        document.getElementById('auth-overlay').style.display = 'flex';

    async function saveShootToDB(shoot) {
      try {
        if (shoot.id) {
          const { error } = await supabase
            .from('shoots')
            .update(shoot)
            .eq('id', shoot.id);
          if (error) throw error;
        } else {
          const { error } = await supabase
            .from('shoots')
            .insert([shoot]);
          if (error) throw error;
        }
        await loadAll();
        showToast('Shoot saved successfully', 'success');
      } catch (error) {
        console.error('Save error:', error);
        showToast('Failed to save: ' + error.message, 'error');
      }
    }

    async function deleteShootFromDB(shootId) {
      try {
        const { error } = await supabase
          .from('shoots')
          .delete()
          .eq('id', shootId);
        if (error) throw error;
        await loadAll();
        showToast('Shoot deleted', 'success');
      } catch (error) {
        console.error('Delete error:', error);
        showToast('Failed to delete: ' + error.message, 'error');
      }
    }

    async function updateSettings() {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) throw new Error('Not authenticated');

        const { error } = await supabase
          .from('settings')
          .upsert({
            id: user.id,
            companies: _companies.filter(c => !DEFAULT_COMPANIES.includes(c)),
            locations: _locs,
            privacyMode: _privacyModeActive
          }, { onConflict: 'id' });
        if (error) throw error;
      } catch (error) {
        console.error('Settings update error:', error);
      }
    }

    function renderTopCompanies() {
      const companyStats = {};
      _shoots.forEach(s => {
        const comp = s.company || 'Direct';
        if (!companyStats[comp]) {
          companyStats[comp] = { shoots: 0, revenue: 0, pending: 0 };
        }
        companyStats[comp].shoots++;
        companyStats[comp].revenue += Number(s.amount || 0);
        if (s.payStatus !== 'done') {
          companyStats[comp].pending += Number(s.amount || 0) - (s.payStatus === 'part' ? Number(s.partPaid || 0) : 0);
        }
      });

      const topCompanies = Object.entries(companyStats)
        .map(([name, data]) => ({ name, ...data }))
        .sort((a, b) => b.revenue - a.revenue)
        .slice(0, 5);

      const container = document.getElementById('dash-top-companies');
      if (!topCompanies.length) {
        container.innerHTML = '<div class="text-center py-4 text-xs text-neutral-500">No company data</div>';
        return;
      }

      container.innerHTML = topCompanies.map((c, i) => `
        <div class="p-3 bg-neutral-950 border border-neutral-900 rounded-lg hover:border-neutral-700 transition">
          <div class="flex items-start justify-between mb-2">

      applyPrivacyUIVisibility();

    function buildInteractiveRevenueGrowthChart() {
      const ctx = document.getElementById('revenueAnalyticsChart');
      if (!ctx) return;

      if (_analyticsChartInstance) {
        _analyticsChartInstance.destroy();
      }

      const monthlyData = {};
      _shoots.forEach(s => {
        if (!s.date) return;
        const monthKey = s.date.slice(0, 7);
        if (!monthlyData[monthKey]) {
          monthlyData[monthKey] = { revenue: 0, expenses: 0 };
        }
        monthlyData[monthKey].revenue += Number(s.amount || 0);
        monthlyData[monthKey].expenses += Number(s.expense || 0);
      });

      const sortedKeys = Object.keys(monthlyData).sort();
      const labels = sortedKeys.map(k => {
        const [y, m] = k.split('-');
        return MONTHS[parseInt(m) - 1].slice(0, 3);
      });
      const revenueData = sortedKeys.map(k => monthlyData[k].revenue);
      const expenseData = sortedKeys.map(k => monthlyData[k].expenses);

      _analyticsChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels.length ? labels : ['No Data'],
          datasets: [
            {
              label: 'Revenue',
              data: revenueData.length ? revenueData : [0],
              backgroundColor: ['#c9a96e'],
              borderColor: '#c9a96e',
              borderWidth: 0,
              borderRadius: { topLeft: 8, topRight: 8, bottomLeft: 0, bottomRight: 0 },
              barThickness: 28,
              maxBarThickness: 40
            },
            {
              label: 'Expenses',
              data: expenseData.length ? expenseData : [0],
              backgroundColor: ['#dc2626'],
              borderColor: '#dc2626',
              borderWidth: 0,
              borderRadius: { topLeft: 8, topRight: 8, bottomLeft: 0, bottomRight: 0 },
              barThickness: 28,
              maxBarThickness: 40
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 30, bottom: 10 } },
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: {
                color: '#a0a0a0',
                font: { size: 12, weight: '600', family: "'Segoe UI', sans-serif" },
                padding: 25,
                usePointStyle: true,
                pointStyle: 'circle'
              }
            },
            tooltip: {
              enabled: !_privacyModeActive,
              backgroundColor: 'rgba(20, 20, 20, 0.98)',
              titleColor: '#ffffff',
              bodyColor: '#e0e0e0',
              borderColor: '#404040',
              borderWidth: 1,
              padding: 15,
              displayColors: true,
              cornerRadius: 8,
              titleFont: { size: 13, weight: 'bold' },
              bodyFont: { size: 12 },
              callbacks: {
                label: ctx => {
                  const val = Math.floor(ctx.parsed.y);
                  return `  ${ctx.dataset.label}: Rs. ${val.toLocaleString('en-IN')}`;
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: 'rgba(100, 100, 100, 0.12)',
                drawBorder: false,
                drawTicks: false
              },
              ticks: {
                color: '#808080',
                font: { size: 11, weight: '500' },
                padding: 10,
                callback: val => val >= 100000 ? 'Rs. ' + (val / 100000).toFixed(1) + 'L' : val >= 1000 ? 'Rs. ' + (val / 1000).toFixed(0) + 'K' : 'Rs. ' + val
              }
            },
            x: {
              grid: { display: false, drawBorder: false },
              ticks: {
                color: '#808080',
                font: { size: 11, weight: '500' },
                padding: 10
              }
            }
          }
        },
        plugins: [{
          id: 'chartDataLabels',
          afterDatasetsDraw(chart) {
            const { ctx: c } = chart;
            chart.data.datasets.forEach((dataset, datasetIndex) => {
              const meta = chart.getDatasetMeta(datasetIndex);
              meta.data.forEach((datapoint, index) => {
                const { x, y } = datapoint.getProps(['x', 'y']);
                const value = dataset.data[index];
                if (value === 0 || value === undefined) return;

                c.save();
                c.font = 'bold 12px "Segoe UI", sans-serif';
                c.fillStyle = '#ffffff';
                c.textAlign = 'center';
                c.textBaseline = 'bottom';

                const displayVal = value >= 100000 ? (value / 100000).toFixed(1) + 'L' : value >= 1000 ? (value / 1000).toFixed(0) + 'K' : value;
                const labelText = 'Rs. ' + displayVal;
                c.fillText(labelText, x, y - 8);
                c.restore();
              });
            });
          }
        }]
      });
    }

    function renderCalendar() {
      const monthLabel = MONTHS[calMonth] + ' ' + calYear;
      document.getElementById('cal-month-label').textContent = monthLabel;

      // Calculate month stats - Fixed to count shoots in the current calendar month
      const monthStart = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-01';
      const lastDay = new Date(calYear, calMonth + 1, 0).getDate();
      const monthEnd = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(lastDay).padStart(2, '0');
      
      const shootsThisMonth = _shoots.filter(s => s.date >= monthStart && s.date <= monthEnd);
      const completedThisMonth = shootsThisMonth.filter(s => s.date < today()).length;
      
      const todayStr = today();
      const upcomingShoots = _shoots.filter(s => s.date >= todayStr).sort((a, b) => a.date.localeCompare(b.date));
      const nextShoot = upcomingShoots[0];
      
      let daysUntilNext = '';
      if (nextShoot) {
        const nextDate = new Date(nextShoot.date + 'T00:00:00');
        const todayDate = new Date();
        const diffTime = nextDate - todayDate;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        if (diffDays === 0) daysUntilNext = 'Today';
        else if (diffDays === 1) daysUntilNext = 'Tomorrow';
        else daysUntilNext = `in ${diffDays} days`;
      }

      // Add stats section
      const existingStats = document.getElementById('cal-stats');
      if (!existingStats) {
        const borderDiv = document.querySelector('#section-calendar .border-b');
        if (borderDiv) {
          const statsDiv = document.createElement('div');
          statsDiv.className = 'grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4';
          statsDiv.id = 'cal-stats';
          statsDiv.innerHTML = `
            <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-4">
              <div class="text-[10px] uppercase font-bold tracking-wider text-neutral-500">Shoots This Month</div>
              <div class="text-2xl font-bold tracking-tight text-[#c9a96e] mt-2">${shootsThisMonth.length}</div>
              <div class="text-[10px] text-neutral-500 mt-1">${completedThisMonth} completed</div>
            </div>
            ${nextShoot ? `
            <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-4">
              <div class="text-[10px] uppercase font-bold tracking-wider text-emerald-500">Next Shoot</div>
              <div class="text-sm font-bold tracking-tight text-white mt-2">${nextShoot.name}</div>
              <div class="text-[10px] text-emerald-400 mt-1">${daysUntilNext}</div>
            </div>
            ` : `
            <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-4">
              <div class="text-[10px] uppercase font-bold tracking-wider text-neutral-500">Next Shoot</div>
              <div class="text-sm font-bold tracking-tight text-neutral-500 mt-2">No upcoming shoots</div>
              <div class="text-[10px] text-neutral-500 mt-1">Schedule one now!</div>
            </div>
            `}
            <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-4">
              <div class="text-[10px] uppercase font-bold tracking-wider text-amber-500">Completed This Month</div>
              <div class="text-2xl font-bold tracking-tight text-amber-500 mt-2">${completedThisMonth}</div>
              <div class="text-[10px] text-neutral-500 mt-1">of ${shootsThisMonth.length} total</div>
            </div>
          `;
          borderDiv.after(statsDiv);
        }
      } else {
        existingStats.innerHTML = `
          <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-4">
            <div class="text-[10px] uppercase font-bold tracking-wider text-neutral-500">Shoots This Month</div>
            <div class="text-2xl font-bold tracking-tight text-[#c9a96e] mt-2">${shootsThisMonth.length}</div>
            <div class="text-[10px] text-neutral-500 mt-1">${completedThisMonth} completed</div>
          </div>
          ${nextShoot ? `
          <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-4">
            <div class="text-[10px] uppercase font-bold tracking-wider text-emerald-500">Next Shoot</div>
            <div class="text-sm font-bold tracking-tight text-white mt-2">${nextShoot.name}</div>
            <div class="text-[10px] text-emerald-400 mt-1">${daysUntilNext}</div>
          </div>
          ` : `
          <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-4">
            <div class="text-[10px] uppercase font-bold tracking-wider text-neutral-500">Next Shoot</div>
            <div class="text-sm font-bold tracking-tight text-neutral-500 mt-2">No upcoming shoots</div>
            <div class="text-[10px] text-neutral-500 mt-1">Schedule one now!</div>
          </div>
          `}
          <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-4">
            <div class="text-[10px] uppercase font-bold tracking-wider text-amber-500">Completed This Month</div>
            <div class="text-2xl font-bold tracking-tight text-amber-500 mt-2">${completedThisMonth}</div>
            <div class="text-[10px] text-neutral-500 mt-1">of ${shootsThisMonth.length} total</div>
          </div>
        `;
      }

      const firstDay = new Date(calYear, calMonth, 1);
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const startingDayOfWeek = firstDay.getDay();

      const grid = document.getElementById('cal-grid');
      let html = '<div class="text-center text-xs font-bold text-neutral-500 py-1">SUN</div><div class="text-center text-xs font-bold text-neutral-500 py-1">MON</div><div class="text-center text-xs font-bold text-neutral-500 py-1">TUE</div><div class="text-center text-xs font-bold text-neutral-500 py-1">WED</div><div class="text-center text-xs font-bold text-neutral-500 py-1">THU</div><div class="text-center text-xs font-bold text-neutral-500 py-1">FRI</div><div class="text-center text-xs font-bold text-neutral-500 py-1">SAT</div>';

        const shootsOnDay = _shoots.filter(s => s.date === dateStr).length;

        html += `<div onclick="calSelectDate('${dateStr}')" class="p-2 rounded text-sm text-center cursor-pointer transition ${isSelected} ${shootsOnDay > 0 ? 'border border-[#c9a96e]/50' : 'border border-transparent'}"><span>${d}</span>${shootsOnDay > 0 ? `<div class="text-[8px] text-neutral-400 mt-0.5">${shootsOnDay}</div>` : ''}</div>`;
      }

      grid.innerHTML = html;

      const contextualShoots = _shoots.filter(s => s.date === calSelected).sort((a, b) => a.date.localeCompare(b.date));
      const panel = document.getElementById('cal-day-panel');
      
      panel.classList.remove('hidden');

      const headerLabel = new Date(calSelected + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

      let interiorHtml = `
        <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-4 mt-4 space-y-4">
          <div class="flex items-center justify-between">
            <div class="text-sm font-bold text-white">${headerLabel}</div>
            <button onclick="openAddShootModal('${calSelected}')" class="text-xs font-semibold bg-[#c9a96e] hover:bg-[#e6c98a] text-black flex items-center gap-1 px-3 py-1.5 rounded-lg transition"><i class="ti ti-plus"></i> Add Shoot</button>
          </div>`;

      if (!contextualShoots.length) {
        interiorHtml += `<p class="text-xs text-neutral-600 py-4 text-center">No shoots scheduled for this day.</p>`;
      } else {
        interiorHtml += `<div class="space-y-2">${contextualShoots.map(s => getShootRowHtmlTemplate(s, false)).join('')}</div>`;
      }
      interiorHtml += `</div>`;
      panel.innerHTML = interiorHtml;
      applyPrivacyUIVisibility();
    }

    function calSelectDate(date) { calSelected = date; renderCalendar(); }
    function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
    function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }
    function calToday() { calYear = new Date().getFullYear(); calMonth = new Date().getMonth(); calSelected = today(); renderCalendar(); }

    function renderShootsList() {
      const q = (document.getElementById('shoot-search')?.value || '').toLowerCase();
      const ft = document.getElementById('filter-timeline')?.value || '';
      const fc = document.getElementById('filter-company')?.value || '';
      const fl = document.getElementById('filter-loc')?.value || '';
      const td = today();

      // Calculate stats
      const totalShoots = _shoots.length;
      const upcomingShoots = _shoots.filter(s => s.date >= td).length;
      const completedShoots = _shoots.filter(s => s.date < td).length;
      
      document.getElementById('stat-total').textContent = totalShoots;
      document.getElementById('stat-upcoming').textContent = upcomingShoots;
      document.getElementById('stat-completed').textContent = completedShoots;

      const compDropdown = document.getElementById('filter-company');
      if (compDropdown) {
        const cachedSelection = compDropdown.value;
        compDropdown.innerHTML = '<option value="">All Companies</option>' + _companies.map(c => `<option value="${c}" ${c === cachedSelection ? 'selected' : ''}>${c}</option>`).join('');
      }

      const locDropdown = document.getElementById('filter-loc');
      if (locDropdown) {
        const cachedSelection = locDropdown.value;
        locDropdown.innerHTML = '<option value="">All Locations</option>' + [...DEFAULT_LOCS, ..._locs].map(l => `<option value="${l}" ${l === cachedSelection ? 'selected' : ''}>${l}</option>`).join('');
      }

      let filtered = [..._shoots].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      
      if (q) filtered = filtered.filter(s => (s.name + s.location + s.company + s.notes).toLowerCase().includes(q));
      if (fc) filtered = filtered.filter(s => s.company === fc);
      if (fl) filtered = filtered.filter(s => s.location === fl);
      
      if (ft === 'upcoming') {
        filtered = filtered.filter(s => s.date >= td).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      } else if (ft === 'completed') {
        filtered = filtered.filter(s => s.date < td);
      }

      // Group by month
      const grouped = {};
      filtered.forEach(s => {
        const monthKey = s.date.slice(0, 7); // YYYY-MM
        if (!grouped[monthKey]) grouped[monthKey] = [];
        grouped[monthKey].push(s);
      });

      const targetContainer = document.getElementById('shoots-list');
      if (!targetContainer) return;
      if (!filtered.length) {
        targetContainer.innerHTML = '<div class="text-center py-12 text-xs text-neutral-600 border border-neutral-900 border-dashed rounded-xl">No matching shoots found.</div>';
      } else {
        let html = '';
        const sortedMonths = Object.keys(grouped).sort().reverse();
        sortedMonths.forEach(monthKey => {
          const shoots = grouped[monthKey];
          const [year, month] = monthKey.split('-');
          const monthName = MONTHS[parseInt(month) - 1];
          const monthLabel = `${monthName} ${year}`;
          
          html += `<div class="mb-6">
            <div class="flex items-center gap-2 px-2 py-2 mb-3 border-b border-neutral-900">
              <i class="ti ti-calendar text-[#c9a96e]"></i>
              <h3 class="text-sm font-bold text-white tracking-wide">${monthLabel}</h3>
              <span class="text-xs text-neutral-500 ml-auto">${shoots.length} shoots</span>
            </div>
            <div class="space-y-2">
              ${shoots.map(s => getShootRowHtmlTemplate(s, false)).join('')}
            </div>
          </div>`;
        });
        targetContainer.innerHTML = html;
      }
      applyPrivacyUIVisibility();
    }

    async function saveShoot() {
      const name = document.getElementById('f-shoot-name').value.trim();
      const date = document.getElementById('f-shoot-date').value;
      if (!name || !date) { showToast('Please enter a Name and Date', 'error'); return; }

      let event = document.getElementById('f-shoot-event').value;
      if (event === 'Other') event = document.getElementById('f-shoot-event-other').value.trim() || 'Other';

      let location = document.getElementById('f-shoot-loc').value;
      if (location === '__other__') {
        location = document.getElementById('f-shoot-loc-other').value.trim();
        if (location && !_locs.includes(location) && !DEFAULT_LOCS.includes(location)) {
          _locs.push(location); await saveSettingToDB('locations', _locs);
        }
      }

      const payStatus = document.getElementById('f-shoot-pay-status').value;
      const expenseStatus = document.getElementById('f-shoot-expense-status').value;
      const amount = parseFloat(document.getElementById('f-shoot-amount').value) || 0;
      const expense = parseFloat(document.getElementById('f-shoot-expense').value) || 0;
      const partPaid = payStatus === 'part' ? (parseFloat(document.getElementById('f-shoot-part-paid').value) || 0) : (payStatus === 'done' ? amount : 0);

      const editId = document.getElementById('edit-shoot-id').value;
      const record = {
        id: editId || uid(),
        name, date, event,
        session: document.getElementById('f-shoot-session').value,
        location,
        company: document.getElementById('f-shoot-company').value,
        notes: document.getElementById('f-shoot-notes').value.trim(),
        amount, expense, expenseStatus, payStatus, partPaid,
        created: editId ? (_shoots.find(x => x.id === editId)?.created || new Date().toISOString()) : new Date().toISOString()
      };

      try {
        await saveShootToDB(record);
        closeShootModal();
        refreshCurrentView();
      } catch (e) {}
    }

    function renderDatePicker() {
      const label = document.getElementById('date-picker-label');
      label.textContent = MONTHS[datePickerMonth] + ' ' + datePickerYear;

      const firstDay = new Date(datePickerYear, datePickerMonth, 1);
      const daysInMonth = new Date(datePickerYear, datePickerMonth + 1, 0).getDate();
      const startingDayOfWeek = firstDay.getDay();

      const grid = document.getElementById('date-picker-grid');
      let html = '';
      for (let i = 0; i < startingDayOfWeek; i++) html += '<div></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = datePickerYear + '-' + String(datePickerMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        html += `<button type="button" onclick="selectDateFromPicker('${dateStr}')" class="text-xs p-1.5 rounded hover:bg-[#c9a96e] hover:text-black transition">${d}</button>`;
      }
      grid.innerHTML = html;
    }

    function downloadCompanyViewPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const margin = 14;
      let yPos = 12;
      doc.setFillColor(5, 5, 5);
      doc.rect(0, 0, pageWidth, pageHeight, 'F');
      doc.setFillColor(15, 15, 15);
      doc.rect(0, 0, pageWidth, 26, 'F');
      doc.setDrawColor(201, 169, 110);
      doc.setLineWidth(0.5);
      doc.line(0, 26, pageWidth, 26);
      doc.setFontSize(18);
      doc.setTextColor(201, 169, 110);
      doc.setFont(undefined, 'bold');
      doc.text('JASHWANTH JP', margin, yPos + 6);
      yPos = 32;
      const companyFilter = document.getElementById('pay-filter-company')?.value || '';
      if (!companyFilter) {
        doc.setFontSize(10);
        doc.setTextColor(220, 53, 69);
        doc.text('Please select a company', margin, yPos);
        doc.save(`JP_Report_${new Date().toISOString().split('T')[0]}.pdf`);
        showToast('Please select a company', 'error');
        return;
      }
      doc.setFontSize(9);
      doc.setFont(undefined, 'bold');
      doc.setTextColor(255, 255, 255);
      doc.text('Company - ' + companyFilter, margin, yPos);
      doc.setFontSize(7);
      doc.setFont(undefined, 'normal');
      doc.setTextColor(150, 150, 150);
      const dateStr = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
      doc.text('Generated: ' + dateStr, margin, yPos + 6);
      yPos += 14;
      let filtered = _shoots.filter(s => s.company === companyFilter && s.amount);
      if (filtered.length === 0) {
        doc.setFontSize(10);
        doc.setTextColor(220, 53, 69);
        doc.text('No data', margin, yPos);
        doc.save(`JP_${companyFilter}_${new Date().toISOString().split('T')[0]}.pdf`);
        showToast('No data', 'error');
        return;
      }
      const total = filtered.reduce((a, s) => a + Number(s.amount || 0), 0);
      const totalExpenses = filtered.reduce((a, s) => a + Number(s.expense || 0), 0);
      const grossTotal = total + totalExpenses;
      const received = filtered.reduce((a, s) => s.payStatus === 'done' ? a + Number(s.amount || 0) : s.payStatus === 'part' ? a + Number(s.partPaid || 0) : a, 0);
      const due = (total + totalExpenses) - received;
      const boxW = (pageWidth - 2 * margin - 8) / 3;
      [{ label: 'TOTAL', value: grossTotal, color: [201, 169, 110] }, { label: 'DUE', value: due, color: [220, 53, 69] }, { label: 'EXPENSES', value: totalExpenses, color: [255, 152, 0] }].forEach((s, i) => {
        const x = margin + i * (boxW + 4);
        doc.setFillColor(20, 20, 20);
        doc.rect(x, yPos, boxW, 15, 'F');
        doc.setDrawColor(50, 50, 50);
        doc.rect(x, yPos, boxW, 15);
        doc.setFontSize(7);
        doc.setTextColor(120, 120, 120);
        doc.text(s.label, x + 3, yPos + 4);
        doc.setFontSize(10);
        doc.setFont(undefined, 'bold');
        doc.setTextColor(...s.color);
        doc.text('Rs. ' + s.value.toLocaleString('en-IN'), x + 3, yPos + 12);
      });
      yPos += 20;
      const grouped = {};
      filtered.sort((a, b) => (b.date || '').localeCompare(a.date || '')).forEach(s => {
        const k = s.date.slice(0, 7);
        if (!grouped[k]) grouped[k] = [];
        grouped[k].push(s);
      });
      Object.keys(grouped).sort().reverse().forEach(monthKey => {
        if (yPos > pageHeight - 25) {
          doc.addPage();
          doc.setFillColor(5, 5, 5);
          doc.rect(0, 0, pageWidth, pageHeight, 'F');
          yPos = margin;
        }
        const shoots = grouped[monthKey];
        const [year, month] = monthKey.split('-');
        const monthName = MONTHS[parseInt(month) - 1];
        const monthTotal = shoots.reduce((a, s) => a + Number(s.amount || 0), 0);
        doc.setFillColor(20, 20, 20);
        doc.rect(margin, yPos, pageWidth - 2 * margin, 8, 'F');
        doc.setDrawColor(80, 80, 80);
        doc.line(margin, yPos + 8, pageWidth - margin, yPos + 8);
        doc.setFontSize(9);
        doc.setFont(undefined, 'bold');
        doc.setTextColor(201, 169, 110);
        doc.text(monthName + ' ' + year, margin + 3, yPos + 6);
        doc.setFontSize(7);
        doc.setTextColor(150, 150, 150);
        doc.text('Rs. ' + monthTotal.toLocaleString('en-IN'), pageWidth - margin - 30, yPos + 6);
        yPos += 11;
        shoots.forEach(s => {
          if (yPos > pageHeight - 12) {
            doc.addPage();
            doc.setFillColor(5, 5, 5);
            doc.rect(0, 0, pageWidth, pageHeight, 'F');
            yPos = margin;
          }
          doc.setFillColor(15, 15, 15);
          doc.rect(margin, yPos, pageWidth - 2 * margin, 10, 'F');
          doc.setDrawColor(50, 50, 50);
          doc.rect(margin, yPos, pageWidth - 2 * margin, 10);
          const dateObj = new Date(s.date + 'T00:00:00');
          const dateFormatted = dateObj.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' });
          doc.setFontSize(8);
          doc.setFont(undefined, 'bold');
          doc.setTextColor(255, 255, 255);
          doc.text(dateFormatted + ' • ' + s.name, margin + 3, yPos + 3);
          doc.setFontSize(7);
          doc.setFont(undefined, 'normal');
          doc.setTextColor(150, 150, 150);
          doc.text(s.event, margin + 3, yPos + 7.5);
          doc.setFontSize(8);
          doc.setFont(undefined, 'bold');
          doc.setTextColor(201, 169, 110);
          doc.text('Rs. ' + Number(s.amount).toLocaleString('en-IN'), pageWidth - margin - 35, yPos + 3);
          doc.setFontSize(6);
          const statusColor = { 'done': [76, 175, 80], 'part': [255, 152, 0], 'pending': [220, 53, 69] }[s.payStatus];
          doc.setTextColor(...statusColor);
          const statusLabel = { 'done': 'SETTLED', 'part': 'PARTIAL', 'pending': 'PENDING' }[s.payStatus];
          doc.text(statusLabel, pageWidth - margin - 35, yPos + 7.5);
          let nextY = yPos + 12;
          if (s.expense) {
            doc.setFontSize(8);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(255, 152, 0);
            doc.text('Expenses: Rs. ' + Number(s.expense).toLocaleString('en-IN'), margin + 3, nextY);
            nextY += 5;
          }
          if (s.notes) {
            doc.setFontSize(6);
            doc.setTextColor(150, 150, 150);
            const noteText = s.notes.substring(0, 50);

    // ====== ACCOUNT & SETTINGS FUNCTIONS ======

    function validatePINInput(input) {
      input.value = input.value.replace(/[^0-9]/g, '').slice(0, 6);
    }

    async function savePIN() {
      try {
        const newPin = document.getElementById('new-pin').value;
        const confirmPin = document.getElementById('confirm-pin').value;

        if (!newPin || newPin.length < 4) {
          showToast('PIN must be 4-6 digits', 'error');
          return;
        }
        if (newPin !== confirmPin) {
          showToast('PINs do not match', 'error');
          return;
        }

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) throw new Error('Not authenticated');

        // Hash the PIN (simple hash for demo - use bcrypt in production)
        const hashedPin = btoa(newPin);

        const { error } = await supabase
          .from('settings')
          .upsert({
            id: user.id,
            privacyPin: hashedPin
          }, { onConflict: 'id' });
        if (error) throw error;

        document.getElementById('new-pin').value = '';
        document.getElementById('confirm-pin').value = '';
        document.getElementById('pin-set-status').textContent = '✓ PIN Set';
        showToast('Privacy PIN saved', 'success');
      } catch (error) {
        showToast('Error saving PIN: ' + error.message, 'error');
      }
    }

    async function saveBusinessDetails() {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) throw new Error('Not authenticated');

        const details = {
          id: user.id,
          businessName: document.getElementById('business-name').value,
          phoneNumber: document.getElementById('phone-number').value,
          instagramHandle: document.getElementById('instagram-handle').value,
          upiId: document.getElementById('upi-id').value
        };

        const { error } = await supabase
          .from('settings')
          .upsert(details, { onConflict: 'id' });
        if (error) throw error;

        showToast('Business details saved', 'success');
      } catch (error) {
        showToast('Error saving details: ' + error.message, 'error');
      }
    }

    function downloadLedgerCSV() {
      try {
        let csv = 'Date,Name,Event,Company,Location,Amount,Expenses,Payment Status,Expense Status\n';
        
        _shoots.forEach(s => {
          const row = [
            s.date || '',
            s.name || '',
            s.event || '',
            s.company || '',
            s.location || '',
            s.amount || 0,
            s.expense || 0,
            s.payStatus || 'pending',
            s.expenseStatus || 'pending'
          ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
          csv += row + '\n';
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Sakkhi_Ledger_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Ledger exported', 'success');
      } catch (error) {
        showToast('Export failed: ' + error.message, 'error');
      }
    }

    function clearLocalData() {
      if (confirm('Clear all local app data? This cannot be undone.')) {
        localStorage.clear();
        showToast('Local data cleared', 'success');
        setTimeout(() => location.reload(), 500);
      }
    }
