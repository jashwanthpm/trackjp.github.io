<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sakkhi | Invoices & Dues</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"><style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0a0a;color:#e8e8e8}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:8px}
.panel{background:#0f0f0f;border:1px solid #202020;border-radius:12px}
.field{width:100%;background:#090909;border:1px solid #292929;border-radius:8px;padding:9px 11px;color:#eee;font-size:12px;outline:none}
.field:focus{border-color:rgba(201,169,110,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;transition:.15s}
.btn-gold{background:#c9a96e;color:#090909}.btn-gold:hover{background:#e0c184}
.btn-ghost{border:1px solid #303030;color:#d4d4d4}.btn-ghost:hover{border-color:#c9a96e;color:#c9a96e}
.eyebrow{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#777}
.muted{color:#858585}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#777;font-weight:800;border-bottom:1px solid #252525;padding:10px 12px}td{font-size:12px;color:#ddd;border-bottom:1px solid #1e1e1e;padding:11px 12px;vertical-align:middle}
.badge{display:inline-flex;align-items:center;border:1px solid #333;border-radius:999px;padding:3px 8px;font-size:10px;color:#aaa}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:#151515;border:1px solid #333;padding:10px 14px;border-radius:10px;font-size:12px;box-shadow:0 10px 30px #0008}
</style></head>
<body class="min-h-screen p-3 sm:p-5"><main class="max-w-5xl mx-auto space-y-4">
<header class="flex items-center justify-between border-b border-neutral-900 pb-3"><div><h2 class="text-lg md:text-xl font-bold text-white flex items-center gap-2"><i class="ti ti-receipt text-[#c9a96e]"></i> Invoices & Dues</h2><p class="text-[11px] text-neutral-500 mt-1">Create quotations and invoices, track acceptance, payments, and outstanding balances.</p></div><span id="sync-pill" class="badge"><span class="w-1.5 h-1.5 rounded-full bg-neutral-500 mr-1.5"></span>Workspace</span></header>

<section class="grid grid-cols-1 sm:grid-cols-3 gap-2"><article class="panel p-3"><p class="text-[10px] text-neutral-500">Total billed</p><p id="total-billed" class="text-xl font-bold mt-1">₹0</p></article><article class="panel p-3"><p class="text-[10px] text-neutral-500">Received</p><p id="total-paid" class="text-xl font-bold mt-1">₹0</p></article><article class="panel p-3"><p class="text-[10px] text-neutral-500">Outstanding</p><p id="total-due" class="text-xl font-bold mt-1 text-[#c9a96e]">₹0</p></article></section>
<section class="panel p-4"><div class="flex flex-wrap items-center justify-between gap-2 mb-3"><div><h3 class="text-sm font-bold">Document register</h3><p class="text-[10px] text-neutral-500 mt-1">Quotations and invoices are stored in your workspace.</p></div><button id="new-doc" class="btn btn-gold"><i class="ti ti-plus"></i> New quotation / invoice</button></div><div id="doc-form-panel" class="hidden border border-neutral-800 rounded-lg p-3 mb-4"><form id="doc-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"><input id="doc-id" type="hidden"><label class="text-[10px] text-neutral-500">Document type<select id="doc-type" class="field mt-1"><option>Quotation</option><option>Invoice</option></select></label><label class="text-[10px] text-neutral-500">Client / studio<select id="doc-client" class="field mt-1"><option value="">Choose client…</option></select></label><label class="text-[10px] text-neutral-500">Title / project<input id="doc-title" required class="field mt-1" placeholder="Wedding photography"></label><label class="text-[10px] text-neutral-500">Issue date<input id="doc-date" type="date" required class="field mt-1"></label><label class="text-[10px] text-neutral-500">Due date<input id="doc-due" type="date" class="field mt-1"></label><label class="text-[10px] text-neutral-500">Total amount (₹)<input id="doc-amount" type="number" min="0" required class="field mt-1" placeholder="0"></label><label class="text-[10px] text-neutral-500">Paid so far (₹)<input id="doc-paid" type="number" min="0" class="field mt-1" value="0"></label><label class="text-[10px] text-neutral-500">Status<select id="doc-status" class="field mt-1"><option>Draft</option><option>Sent</option><option>Accepted</option><option>Part Paid</option><option>Paid</option><option>Overdue</option><option>Cancelled</option></select></label><label class="text-[10px] text-neutral-500 sm:col-span-2 lg:col-span-4">Description / line items<textarea id="doc-notes" rows="2" class="field mt-1" placeholder="Coverage, deliverables, travel, album, payment terms…"></textarea></label><div class="sm:col-span-2 lg:col-span-4 flex gap-2"><button class="btn btn-gold" type="submit">Save document</button><button id="cancel-doc" type="button" class="btn btn-ghost">Cancel</button></div></form></div><input id="doc-search" class="field" placeholder="Search documents…"><div class="table-wrap mt-3"><table><thead><tr><th>Document</th><th>Client</th><th>Dates</th><th>Amount / due</th><th>Status</th><th>Actions</th></tr></thead><tbody id="doc-rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script>
const DB_URL='https://smyupcjfusgduaoxqfvu.supabase.co';
const DB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNteXVwY2pmdXNnZHVhb3hxZnZ1IiwiaWF0IjoxNzc5ODYwNzMyLCJleHAiOjIwOTU0MzY3MzJ9.pGg9ZIYWpZ70R_HNtRl7FHrzeUNA5vlZT6hNkjDzhqo';
function currentUser(){try{return JSON.parse(localStorage.getItem('currentUser')||sessionStorage.getItem('currentUser')||'null')}catch(e){return null}}
function sessionToken(){
 const u=currentUser(); if(u&&(u.access_token||u.accessToken))return u.access_token||u.accessToken;
 for(const store of [localStorage,sessionStorage]){
  for(let i=0;i<store.length;i++){const k=store.key(i);if(!k||!k.startsWith('sb-')||!k.endsWith('-auth-token'))continue;
   try{const v=JSON.parse(store.getItem(k));if(v&&v.access_token)return v.access_token;if(v&&v.currentSession&&v.currentSession.access_token)return v.currentSession.access_token}catch(e){}
  }
 }
 return null;
}
function userId(){const u=currentUser();return u&&(u.id||u.user_id)}
function authHeaders(extra){const t=sessionToken();return Object.assign({'apikey':DB_KEY,'Authorization':'Bearer '+(t||DB_KEY),'Content-Type':'application/json'},extra||{})}
async function api(path,opts){
 if(!currentUser()||!userId())throw new Error('Please sign in to Sakkhi again before using Enterprise.');
 if(!sessionToken())throw new Error('Your secure Supabase session was not found. Sign out and sign in again, then retry.');
 const res=await fetch(DB_URL+'/rest/v1/'+path,Object.assign({cache:'no-store',headers:authHeaders()},opts||{}));
 const txt=await res.text();if(!res.ok)throw new Error(txt||('Request failed ('+res.status+')'));return txt?JSON.parse(txt):null;
}
function enc(v){return encodeURIComponent(String(v==null?'':v))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(v)||0)}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
async function getSetting(suffix, fallback){
 const key=userId()+'_'+suffix;const rows=await api('settings?key=eq.'+enc(key)+'&select=value');
 return rows&&rows.length?rows[0].value:fallback;
}
async function setSetting(suffix,value){
 const id=userId(),key=id+'_'+suffix;
 await api('settings?on_conflict=key%2Cuser_id',{method:'POST',headers:authHeaders({'Prefer':'resolution=merge-duplicates,return=representation'}),body:JSON.stringify({key:key,user_id:id,value:value})});
}
function requireUser(){if(!currentUser()||!userId()){document.body.innerHTML='<div class="min-h-screen flex items-center justify-center p-6"><div class="panel p-6 max-w-sm text-center"><h2 class="font-bold text-white">Sign in required</h2><p class="text-sm text-neutral-400 mt-2">Please sign in to Sakkhi and reopen Enterprise.</p><a class="btn btn-gold mt-4" href="/">Go to Sakkhi</a></div></div>';return false}if(!sessionToken()){document.body.innerHTML='<div class="min-h-screen flex items-center justify-center p-6"><div class="panel p-6 max-w-sm text-center"><h2 class="font-bold text-white">Session refresh needed</h2><p class="text-sm text-neutral-400 mt-2">A secure Supabase session is needed to save changes. Sign out and sign in again, then reopen Enterprise.</p><a class="btn btn-gold mt-4" href="/">Go to Sakkhi</a></div></div>';return false}return true}


let docs=[],clients=[];
function statusFor(d){if(d.type==='Quotation')return d.status||'Draft';const due=Math.max(0,Number(d.amount||0)-Number(d.paid||0));return due===0?'Paid':Number(d.paid||0)>0?'Part Paid':d.status||'Sent'}
function resetDoc(){document.getElementById('doc-form').reset();document.getElementById('doc-id').value='';document.getElementById('doc-date').value=new Date().toISOString().slice(0,10);document.getElementById('doc-paid').value=0;document.getElementById('doc-form-panel').classList.add('hidden')}
function render(){const billed=docs.filter(d=>d.type==='Invoice').reduce((n,d)=>n+Number(d.amount||0),0),paid=docs.filter(d=>d.type==='Invoice').reduce((n,d)=>n+Number(d.paid||0),0);document.getElementById('total-billed').textContent=money(billed);document.getElementById('total-paid').textContent=money(paid);document.getElementById('total-due').textContent=money(Math.max(0,billed-paid));const q=document.getElementById('doc-search').value.toLowerCase(),list=docs.filter(d=>(d.title+' '+d.type+' '+d.clientName+' '+d.status).toLowerCase().includes(q));document.getElementById('doc-rows').innerHTML=list.length?list.map(d=>'<tr><td><p class="font-semibold">'+esc(d.title)+'</p><p class="text-[10px] text-neutral-500">'+esc(d.type)+' · '+esc(d.id)+'</p></td><td>'+esc(d.clientName||'—')+'</td><td>'+esc(d.date||'—')+'<p class="text-[10px] text-neutral-500">Due '+esc(d.dueDate||'—')+'</p></td><td>'+money(d.amount)+'<p class="text-[10px] text-neutral-500">Paid '+money(d.paid||0)+'</p></td><td><span class="badge">'+esc(statusFor(d))+'</span></td><td><div class="flex flex-wrap gap-1">'+(d.type==='Quotation'&&d.status!=='Accepted'?'<button class="btn btn-ghost" data-accept="'+esc(d.id)+'">Accept</button>':'')+'<button class="btn btn-ghost" data-edit="'+esc(d.id)+'">Edit</button><button class="btn btn-ghost" data-del="'+esc(d.id)+'">×</button></div></td></tr>').join(''):'<tr><td colspan="6" class="text-center py-8 text-neutral-500">No quotations or invoices yet. Create one above.</td></tr>';
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const d=docs.find(x=>x.id===b.dataset.edit);document.getElementById('doc-form-panel').classList.remove('hidden');['id','type','title','date','due','amount','paid','status','notes'].forEach(k=>{const el=document.getElementById('doc-'+k);if(el)el.value=({due:d.dueDate}[k]||d[k]||'')});document.getElementById('doc-client').value=d.clientId||''});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this document?'))return;docs=docs.filter(d=>d.id!==b.dataset.del);try{await setSetting('enterprise_documents',docs);render();toast('Document deleted')}catch(e){toast(e.message)}});document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{const d=docs.find(x=>x.id===b.dataset.accept);d.status='Accepted';try{await setSetting('enterprise_documents',docs);render();toast('Quotation marked accepted')}catch(e){toast(e.message)}})}
async function load(){if(!requireUser())return;try{docs=await getSetting('enterprise_documents',[]);clients=await getSetting('enterprise_clients',[]);document.getElementById('doc-client').innerHTML='<option value="">Choose client…</option>'+clients.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');render()}catch(e){toast('Could not load documents: '+e.message)}}
document.getElementById('new-doc').onclick=()=>{resetDoc();document.getElementById('doc-form-panel').classList.remove('hidden')};document.getElementById('cancel-doc').onclick=resetDoc;document.getElementById('doc-search').oninput=render;document.getElementById('doc-form').onsubmit=async e=>{e.preventDefault();const id=document.getElementById('doc-id').value,clientId=document.getElementById('doc-client').value,client=clients.find(c=>c.id===clientId);const d={id:id||'doc_'+Date.now().toString(36),type:document.getElementById('doc-type').value,clientId:clientId,clientName:client?client.name:'',title:document.getElementById('doc-title').value.trim(),date:document.getElementById('doc-date').value,dueDate:document.getElementById('doc-due').value,amount:Number(document.getElementById('doc-amount').value)||0,paid:Number(document.getElementById('doc-paid').value)||0,status:document.getElementById('doc-status').value,notes:document.getElementById('doc-notes').value.trim(),updatedAt:new Date().toISOString()};docs=id?docs.map(x=>x.id===id?d:x):[d,...docs];try{await setSetting('enterprise_documents',docs);resetDoc();render();toast('Document saved')}catch(err){toast('Save failed: '+err.message)}};load();</script></body></html>
