<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Page Not Found | Sakkhi</title>
  
  <link rel="icon" type="image/png" href="sakkhi 300px.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #030303; 
      color: #e8e8e8; 
      overflow: hidden;
    }
    .brand-serif { font-family: 'Cinzel', serif; }
    
    /* Cinematic Film Grain Overlay */
    .noise-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
    
    .text-outline { -webkit-text-stroke: 1px rgba(201,169,110,0.15); color: transparent; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center antialiased selection:bg-[#c9a96e] selection:text-black relative">

  <div class="noise-overlay"></div>

  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[50vw] h-[50vw] bg-[#c9a96e] opacity-[0.05] blur-[150px] rounded-full pointer-events-none z-0"></div>

  <header class="fixed top-0 left-0 w-full px-6 py-6 flex items-center justify-center z-50">
    <img src="SAKKHIheader.png" alt="Sakkhi Logo" class="h-8 md:h-10 w-auto object-contain opacity-80" />
  </header>

  <div class="relative z-10 flex flex-col items-center text-center px-4 w-full max-w-2xl mt-10">
    
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[40vw] sm:text-[300px] brand-serif text-outline leading-none select-none z-0 opacity-40">404</div>
    
    <div class="relative z-10 space-y-6">
      <div class="w-16 h-16 rounded-full bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500 text-3xl mx-auto mb-6">
        <i class="ti ti-aperture-off"></i>
      </div>
      
      <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight">Lens Cap Is On</h1>
      
      <p class="text-neutral-400 text-sm md:text-base font-light leading-relaxed max-w-md mx-auto">
        The page you are looking for has been moved, deleted, or does not exist. Let's get you back to the studio.
      </p>

      <div class="pt-8 flex flex-col sm:flex-row items-center justify-center gap-4">
        <a href="/app.html" class="w-full sm:w-auto bg-gradient-to-r from-[#c9a96e] to-[#d4b98c] hover:from-[#d4b98c] hover:to-[#e6c98a] text-black font-bold text-sm px-8 py-3.5 rounded-xl shadow-[0_0_20px_rgba(201,169,110,0.2)] hover:shadow-[0_0_30px_rgba(201,169,110,0.4)] hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2">
          Open Dashboard
        </a>
        
        <a href="/" class="w-full sm:w-auto bg-transparent border border-white/10 hover:bg-white/5 text-white font-bold text-sm px-8 py-3.5 rounded-xl transition-all duration-300 flex items-center justify-center">
          Return Home
        </a>
      </div>
    </div>
  </div>

  <footer class="fixed bottom-6 left-0 w-full text-center z-10">
    <p class="text-[10px] text-neutral-600 font-bold uppercase tracking-widest">&copy; 2026 Sakkhi Shoot Management</p>
  </footer>

</body>
</html>
