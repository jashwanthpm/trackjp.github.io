<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sakkhi | Invoices & Dues</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"><style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0a0a;color:#e8e8e8}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:8px}
.panel{background:#0f0f0f;border:1px solid #202020;border-radius:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;transition:.15s}

.muted{color:#858585}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#777;font-weight:800;border-bottom:1px solid #252525;padding:10px 12px}td{font-size:12px;color:#ddd;border-bottom:1px solid #1e1e1e;padding:11px 12px;vertical-align:middle}
.badge{display:inline-flex;align-items:center;border:1px solid #333;border-radius:999px;padding:3px 8px;font-size:10px;color:#aaa}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:#151515;border:1px solid #333;padding:10px 14px;border-radius:10px;font-size:12px;box-shadow:0 10px 30px #0008}
</style></head>
<body class="min-h-screen p-3 sm:p-5"><main class="max-w-5xl mx-auto space-y-4">
<header class="flex items-center justify-between border-b border-neutral-900 pb-3"><div><h2 class="text-lg md:text-xl font-bold text-white flex items-center gap-2"><i class="ti ti-receipt text-[#c9a96e]"></i> Invoices & Dues</h2><p class="text-[11px] text-neutral-500 mt-1">Create quotations and invoices, track acceptance, payments, and outstanding balances.</p></div><span id="sync-pill" class="badge"><span class="w-1.5 h-1.5 rounded-full bg-neutral-500 mr-1.5"></span>Workspace</span></header>

<section class="grid grid-cols-1 sm:grid-cols-3 gap-2"><article class="panel p-3"><p class="text-[10px] text-neutral-500">Total billed</p><p id="total-billed" class="text-xl font-bold mt-1">₹0</p></article><article class="panel p-3"><p class="text-[10px] text-neutral-500">Received</p><p id="total-paid" class="text-xl font-bold mt-1">₹0</p></article><article class="panel p-3"><p class="text-[10px] text-neutral-500">Outstanding</p><p id="total-due" class="text-xl font-bold mt-1 text-[#c9a96e]">₹0</p></article></section>
<section class="panel p-4"><div class="flex flex-wrap items-center justify-between gap-2 mb-3"><div><h3 class="text-sm font-bold">Document register</h3><p class="text-[10px] text-neutral-500 mt-1">Quotations and invoices are stored in your workspace.</p></div><div class="flex flex-wrap gap-2"><button id="new-doc" class="btn btn-gold"><i class="ti ti-file-text"></i> New quotation</button><button id="new-invoice" class="btn btn-ghost"><i class="ti ti-receipt"></i> New invoice</button></div></div><input id="doc-search" class="field" placeholder="Search documents…"><div class="table-wrap mt-3"><table><thead><tr><th>Document</th><th>Client</th><th>Dates</th><th>Amount / due</th><th>Status</th><th>Actions</th></tr></thead><tbody id="doc-rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script>
const DB_URL='https://smyupcjfusgduaoxqfvu.supabase.co';
const DB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNteXVwY2pmdXNnZHVhb3hxZnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NjA3MzIsImV4cCI6MjA5NTQzNjczMn0.pGg9ZIYWpZ70R_HNtRl7FHrzeUNA5vlZT6hNkjDzhqo';
function currentUser(){try{return JSON.parse(localStorage.getItem('currentUser')||sessionStorage.getItem('currentUser')||'null')}catch(e){return null}}
function storedAuthSession(){
 for(const store of [localStorage,sessionStorage]){
  for(let i=0;i<store.length;i++){const k=store.key(i);if(!k||!k.startsWith('sb-')||!k.endsWith('-auth-token'))continue;
   try{const raw=JSON.parse(store.getItem(k));const session=raw&&raw.currentSession?raw.currentSession:raw;if(session&&(session.access_token||session.refresh_token))return {store,key:k,raw,session,nested:!!(raw&&raw.currentSession)}}catch(e){}
  }
 }
 return null;
}
function sessionToken(){const s=storedAuthSession();if(s&&s.session.access_token)return s.session.access_token;const u=currentUser();return u&&(u.access_token||u.accessToken||u.token)||null}
function refreshTokenValue(){const s=storedAuthSession();if(s&&s.session.refresh_token)return s.session.refresh_token;const u=currentUser();return u&&(u.refresh_token||u.refreshToken)||null}
function tokenNeedsRefresh(t){try{const p=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return !!p.exp&&p.exp*1000<Date.now()+45000}catch(e){return false}}
async function refreshSession(){
 const rt=refreshTokenValue();if(!rt)return null;
 const res=await fetch(DB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:DB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt}),cache:'no-store'});
 const txt=await res.text();if(!res.ok)throw new Error(txt||'Session refresh failed');const next=JSON.parse(txt),s=storedAuthSession();
 if(s){if(s.nested)s.raw.currentSession=Object.assign({},s.raw.currentSession,next);else s.raw=Object.assign({},s.raw,next);s.store.setItem(s.key,JSON.stringify(s.raw))}
 try{for(const store of [localStorage,sessionStorage]){const raw=store.getItem('currentUser');if(!raw)continue;const u=JSON.parse(raw);if(u&&typeof u==='object'){if('access_token'in u)u.access_token=next.access_token;if('accessToken'in u)u.accessToken=next.access_token;if('token'in u)u.token=next.access_token;if(next.refresh_token&&'refresh_token'in u)u.refresh_token=next.refresh_token;store.setItem('currentUser',JSON.stringify(u))}}}catch(e){}
 return next.access_token;
}
function userId(){const u=currentUser();return u&&(u.id||u.user_id)}
function authHeaders(extra){const t=sessionToken();return Object.assign({'apikey':DB_KEY,'Authorization':'Bearer '+(t||DB_KEY),'Content-Type':'application/json'},extra||{})}
async function api(path,opts){
 if(!currentUser()||!userId())throw new Error('Please sign in to Sakkhi again before using Enterprise.');
 let token=sessionToken();if(!token)throw new Error('Your secure Supabase session was not found. Please sign in again to reconnect Enterprise.');
 if(tokenNeedsRefresh(token)&&refreshTokenValue()){try{token=await refreshSession()||token}catch(e){}}
 const options=opts||{};
 const send=()=>{const extra=Object.assign({},options.headers||{});delete extra.Authorization;delete extra.apikey;delete extra['Content-Type'];return fetch(DB_URL+'/rest/v1/'+path,Object.assign({cache:'no-store'},options,{headers:authHeaders(extra)}))};
 let res=await send();
 if((res.status===401||res.status===403)&&refreshTokenValue()){try{const fresh=await refreshSession();if(fresh)res=await send()}catch(e){}}
 const txt=await res.text();if(!res.ok){let detail=txt;try{const j=JSON.parse(txt);detail=j.message||j.msg||j.hint||txt}catch(e){}throw new Error(detail||('Request failed ('+res.status+')'))}
 return txt?JSON.parse(txt):null;
}

function enc(v){return encodeURIComponent(String(v==null?'':v))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(v)||0)}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
async function getSetting(suffix, fallback){
 const key=userId()+'_'+suffix;const rows=await api('enterprise_settings?key=eq.'+enc(key)+'&select=value');
 return rows&&rows.length?rows[0].value:fallback;
}
async function setSetting(suffix,value){
 const id=userId(),key=id+'_'+suffix;
 await api('enterprise_settings?on_conflict=key%2Cuser_id',{method:'POST',headers:authHeaders({'Prefer':'resolution=merge-duplicates,return=representation'}),body:JSON.stringify({key:key,user_id:id,value:value})});
}
function requireUser(){if(!currentUser()||!userId()){document.body.innerHTML='<div class="min-h-screen flex items-center justify-center p-6"><div class="panel p-6 max-w-sm text-center"><h2 class="font-bold text-white">Sign in required</h2><p class="text-sm text-neutral-400 mt-2">Please sign in to Sakkhi and reopen Enterprise.</p><a class="btn btn-gold mt-4" href="/">Go to Sakkhi</a></div></div>';return false}if(!sessionToken()){document.body.innerHTML='<div class="min-h-screen flex items-center justify-center p-6"><div class="panel p-6 max-w-sm text-center"><h2 class="font-bold text-white">Session refresh needed</h2><p class="text-sm text-neutral-400 mt-2">A secure Supabase session is needed to save changes. Sign out and sign in again, then reopen Enterprise.</p><a class="btn btn-gold mt-4" href="/">Go to Sakkhi</a></div></div>';return false}return true}


let docs=[],clients=[];
function statusFor(d){if(d.type==='Quotation')return d.status||'Draft';const due=Math.max(0,Number(d.amount||0)-Number(d.paid||0));return due===0?'Paid':Number(d.paid||0)>0?'Part Paid':d.status||'Sent'}
function resetDoc(){document.getElementById('doc-form').reset();document.getElementById('doc-id').value='';document.getElementById('doc-date').value=new Date().toISOString().slice(0,10);document.getElementById('doc-paid').value=0;document.getElementById('doc-form-panel').classList.add('hidden')}
function render(){const billed=docs.filter(d=>d.type==='Invoice').reduce((n,d)=>n+Number(d.amount||0),0),paid=docs.filter(d=>d.type==='Invoice').reduce((n,d)=>n+Number(d.paid||0),0);document.getElementById('total-billed').textContent=money(billed);document.getElementById('total-paid').textContent=money(paid);document.getElementById('total-due').textContent=money(Math.max(0,billed-paid));const q=document.getElementById('doc-search').value.toLowerCase(),list=docs.filter(d=>(d.title+' '+d.type+' '+d.clientName+' '+d.status).toLowerCase().includes(q));document.getElementById('doc-rows').innerHTML=list.length?list.map(d=>'<tr><td><p class="font-semibold">'+esc(d.title)+'</p><p class="text-[10px] text-neutral-500">'+esc(d.type)+' · '+esc(d.id)+'</p></td><td>'+esc(d.clientName||'—')+'</td><td>'+esc(d.date||'—')+'<p class="text-[10px] text-neutral-500">Due '+esc(d.dueDate||'—')+'</p></td><td>'+money(d.amount)+'<p class="text-[10px] text-neutral-500">Paid '+money(d.paid||0)+'</p></td><td><span class="badge">'+esc(statusFor(d))+'</span></td><td><div class="flex flex-wrap gap-1">'+(d.type==='Quotation'?(d.status==='Accepted'?'<button class="btn btn-ghost" data-convert="'+esc(d.id)+'">Create invoice</button>':'<button class="btn btn-ghost" data-accept="'+esc(d.id)+'">Accept</button>'):'')+'<button class="btn btn-ghost" data-edit="'+esc(d.id)+'">Edit</button><button class="btn btn-ghost" data-print="'+esc(d.id)+'">Print / PDF</button><button class="btn btn-ghost" data-del="'+esc(d.id)+'">×</button></div></td></tr>').join(''):'<tr><td colspan="6" class="text-center py-8 text-neutral-500">No quotations or invoices yet. Create one above.</td></tr>';
 document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{const d=docs.find(x=>x.id===b.dataset.print);if(d&&d.quotationState)window.open('quotation.html?enterprise=1&documentId='+encodeURIComponent(d.id)+'&docType='+encodeURIComponent(d.type),'_blank');else printDoc(b.dataset.print)});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const d=docs.find(x=>x.id===b.dataset.edit);if(d)window.open('quotation.html?enterprise=1&documentId='+encodeURIComponent(d.id)+'&docType='+encodeURIComponent(d.type),'_blank')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this document?'))return;docs=docs.filter(d=>d.id!==b.dataset.del);try{await setSetting('enterprise_documents',docs);render();toast('Document deleted')}catch(e){toast(e.message)}});document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{const d=docs.find(x=>x.id===b.dataset.accept);d.status='Accepted';try{await setSetting('enterprise_documents',docs);render();toast('Quotation marked accepted')}catch(e){toast(e.message)}});document.querySelectorAll('[data-convert]').forEach(b=>b.onclick=async()=>{const q=docs.find(x=>x.id===b.dataset.convert);if(!q)return;const inv=Object.assign({},q,{id:'inv_'+Date.now().toString(36),type:'Invoice',date:new Date().toISOString().slice(0,10),paid:0,status:'Draft',convertedFrom:q.id,updatedAt:new Date().toISOString()});docs.unshift(inv);try{await setSetting('enterprise_documents',docs);render();toast('Invoice created from accepted quotation')}catch(e){docs=docs.filter(x=>x.id!==inv.id);toast('Invoice creation failed: '+e.message)}})}
function renderTemplates(){const el=document.getElementById('doc-template');el.innerHTML='<option value="">Choose a template…</option>'+templates.map((t,i)=>'<option value="'+i+'">'+esc(t.name)+'</option>').join('')}
function printDoc(id){const d=docs.find(x=>x.id===id);if(!d)return;const html='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(d.type+' '+d.id)+'</title><style>body{font:14px Arial,sans-serif;color:#222;margin:40px}header{display:flex;justify-content:space-between;border-bottom:2px solid #c9a96e;padding-bottom:18px}h1{font-size:24px;margin:0}small{color:#666}.total{font-size:22px;font-weight:bold;text-align:right;margin-top:24px}.notes{white-space:pre-wrap;border-top:1px solid #ddd;padding-top:16px;margin-top:24px}</style></head><body><header><div><h1>Sakkhi Studio</h1><p>'+esc(d.type)+'</p></div><div style="text-align:right"><strong>'+esc(d.id)+'</strong><p>'+esc(d.date||'')+'</p></div></header><section><small>Bill to</small><h2>'+esc(d.clientName||'Client')+'</h2><h3>'+esc(d.title||'Photography services')+'</h3><p>Due date: '+esc(d.dueDate||'—')+'</p></section><div class="notes">'+esc(d.notes||'Services as agreed.')+'</div><div class="total">Total: '+esc(money(d.amount))+'</div><p style="text-align:right">Paid: '+esc(money(d.paid||0))+' · Balance: '+esc(money(Math.max(0,Number(d.amount||0)-Number(d.paid||0))))+'</p><p><small>Status: '+esc(statusFor(d))+'</small></p><button onclick="window.print()">Print / Save as PDF</button></body></html>';const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print this document');return}w.document.open();w.document.write(html);w.document.close()}
async function load(){if(!requireUser())return;try{docs=await getSetting('enterprise_documents',[]);clients=await getSetting('enterprise_clients',[]);render()}catch(e){toast('Could not load documents: '+e.message)}}
document.getElementById('new-doc').onclick=()=>window.open('quotation.html?enterprise=1&docType=Quotation','_blank');
document.getElementById('new-invoice').onclick=()=>window.open('quotation.html?enterprise=1&docType=Invoice','_blank');
document.getElementById('doc-search').oninput=render;
window.addEventListener('focus',()=>load());
load();</script></body></html>
