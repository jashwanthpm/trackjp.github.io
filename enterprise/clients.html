<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakkhi | Studio Clients</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0a0a;color:#e8e8e8}
    ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#c9a96e}
    .panel{background:#0f0f0f;border:1px solid #202020;border-radius:14px}
    .eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#777}
    .field{width:100%;background:#090909;border:1px solid #292929;border-radius:9px;padding:10px 12px;color:#eee;font-size:13px;outline:none}
    .field:focus{border-color:rgba(201,169,110,.65)}
    .muted{color:#858585}
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
  <main class="max-w-5xl mx-auto space-y-6">
    <header class="flex items-center justify-between border-b border-neutral-900 pb-4">
      <div>
        <h2 class="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
          <i class="ti ti-building text-[#c9a96e]"></i> Studio Clients
        </h2>
        <p class="text-xs text-neutral-500 mt-1">Keep client and production-house details organised in one place.</p>
      </div>
      
    </header>
    <section class="panel p-5"><div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"><div><h2 class="font-bold text-white">Client directory</h2><p class="text-xs text-neutral-500 mt-1">Search and manage your studio relationships.</p></div><input class="field sm:max-w-xs" placeholder="Search clients..." /></div><div class="overflow-x-auto mt-5"><table class="w-full text-left text-sm"><thead><tr class="text-[10px] uppercase tracking-widest text-neutral-500 border-b border-neutral-800"><th class="py-3 pr-4">Client / Studio</th><th class="py-3 pr-4">Contact</th><th class="py-3 pr-4">Projects</th><th class="py-3">Status</th></tr></thead><tbody><tr><td colspan="4" class="py-12 text-center text-neutral-500"><i class="ti ti-users text-2xl block mb-2"></i>Client records will appear here once connected.</td></tr></tbody></table></div></section>
  </main>
</body>
</html>
