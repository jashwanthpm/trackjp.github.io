<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sakkhi | Shooters Roster</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #0a0a0a; 
      color: #e8e8e8; 
    }
    
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #c9a96e; }

    .modal-anim-enter {
      opacity: 0;
      transform: scale(0.95) translateY(10px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-anim-active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  </style>
</head>
<body class="p-4 sm:p-8">

  <div id="loading-overlay" class="fixed inset-0 bg-[#0a0a0a] z-50 flex flex-col items-center justify-center gap-4 transition-opacity duration-300">
    <i class="ti ti-loader animate-spin text-3xl text-[#c9a96e]"></i>
    <p class="text-xs text-neutral-500 tracking-wide font-medium">Fetching Live Data from Sakkhi Cloud...</p>
  </div>

  <div class="max-w-5xl mx-auto space-y-6" id="main-content" style="opacity: 0; transition: opacity 0.3s ease;">
    
    <div class="flex items-center justify-between border-b border-neutral-900 pb-4">
      <div>
        <h2 class="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
          <i class="ti ti-camera text-[#c9a96e]"></i> Shooters Roster
        </h2>
        <p class="text-xs text-neutral-500 mt-1">Manage your production team and link them to their Solo accounts.</p>
      </div>
      <div id="sync-status" class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-neutral-800 bg-neutral-950 text-xs font-medium text-neutral-400">
        <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span> Live
      </div>
    </div>

    <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-5 md:p-6 shadow-lg">
      <h3 class="text-sm font-bold text-white mb-4">Add New Shooter</h3>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        
        <div class="flex flex-col gap-1.5 md:col-span-4">
          <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-wider">1. Sakkhi Account Email *</label>
          <input type="email" id="shooter-email" onblur="checkEmailForProfile()" placeholder="rohan@solo.com" class="w-full bg-neutral-950 border border-neutral-900 rounded-lg px-4 py-2.5 text-sm text-white outline-none focus:border-[#c9a96e] transition"/>
        </div>

        <div class="flex flex-col gap-1.5 md:col-span-3">
          <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-wider">2. Full Name</label>
          <div class="relative">
             <input type="text" id="shooter-name" readonly placeholder="Auto-fetched..." class="w-full bg-neutral-950/50 border border-neutral-900 border-dashed rounded-lg px-4 py-2.5 text-sm text-neutral-400 outline-none cursor-not-allowed font-semibold transition-colors"/>
             <i id="name-spinner" class="ti ti-loader animate-spin absolute right-3 top-1/2 -translate-y-1/2 text-[#c9a96e] hidden"></i>
          </div>
        </div>
        
        <div class="flex flex-col gap-1.5 md:col-span-3">
          <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-wider">3. Primary Role</label>
          <select id="shooter-role" onchange="handleRoleChange()" class="w-full bg-neutral-950 border border-neutral-900 rounded-lg px-4 py-2.5 text-sm text-white outline-none focus:border-[#c9a96e] transition cursor-pointer">
            <option value="Lead Photographer">Lead Photographer</option>
            <option value="Candid Photographer">Candid Photographer</option>
            <option value="Cinematographer">Cinematographer</option>
            <option value="Traditional Videographer">Traditional Videographer</option>
            <option value="Drone Operator">Drone Operator</option>
            <option value="Lighting Assistant">Lighting Assistant</option>
            <option value="__custom__">Custom Role...</option>
          </select>
          <input type="text" id="custom-role-input" placeholder="Type custom role..." class="hidden w-full bg-neutral-950 border border-neutral-900 rounded-lg px-4 py-2 text-sm text-white outline-none focus:border-[#c9a96e] transition mt-1"/>
        </div>
        
        <div class="flex items-end md:col-span-2">
          <button onclick="addShooter()" class="w-full bg-[#c9a96e] hover:bg-[#e6c98a] text-black font-bold text-sm px-4 py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(201,169,110,0.15)]">
            <i class="ti ti-plus"></i> Add
          </button>
        </div>
        
      </div>
    </div>

    <div class="bg-[#0f0f0f] border border-neutral-900 rounded-xl p-5 md:p-6 shadow-lg">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5 border-b border-neutral-900/50 pb-4">
        <h3 class="text-sm font-bold text-white">Active Team Members</h3>
        <div class="relative w-full sm:w-64">
          <i class="ti ti-search absolute left-3 top-1/2 -translate-y-1/2 text-neutral-500"></i>
          <input type="text" id="roster-search" oninput="renderShooters()" placeholder="Search members..." class="w-full bg-neutral-950 border border-neutral-800 rounded-lg pl-9 pr-3 py-2 text-sm text-white outline-none focus:border-[#c9a96e] transition"/>
        </div>
      </div>

      <div id="shooters-list" class="flex flex-col gap-3"></div>
    </div>
    
  </div>

  <div id="details-modal-backdrop" class="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300" onclick="if(event.target === this) closeDetailsModal()">
    <div id="details-modal-content" class="bg-[#0f0f0f] border border-neutral-900 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden modal-anim-enter">
      
      <div class="p-6 border-b border-neutral-800 bg-[#0a0a0a] flex items-center gap-4">
        <div id="modal-initials" class="w-14 h-14 rounded-full bg-gradient-to-tr from-[#c9a96e] to-[#a3854a] flex items-center justify-center text-black font-bold text-xl shrink-0"></div>
        <div class="flex-1 min-w-0">
          <h3 id="modal-name" class="text-lg font-bold text-white truncate">Name</h3>
          <p id="modal-role" class="text-xs text-[#c9a96e] font-semibold tracking-wide uppercase mt-0.5">Role</p>
        </div>
        <button onclick="closeDetailsModal()" class="text-neutral-500 hover:text-white transition bg-neutral-900 hover:bg-neutral-800 p-2 rounded-lg"><i class="ti ti-x text-lg"></i></button>
      </div>

      <div class="p-6 space-y-5">
        <div class="space-y-3">
          <h4 class="text-[10px] uppercase font-bold text-neutral-500 tracking-wider border-b border-neutral-900 pb-2">Contact Details</h4>
          
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-neutral-900 flex items-center justify-center text-blue-400"><i class="ti ti-mail"></i></div>
            <div class="flex-1 min-w-0">
              <p class="text-[10px] text-neutral-500">Email Address</p>
              <p id="modal-email" class="text-sm font-semibold text-white truncate"></p>
            </div>
          </div>
          
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-neutral-900 flex items-center justify-center text-emerald-400"><i class="ti ti-phone"></i></div>
            <div class="flex-1 min-w-0">
              <p class="text-[10px] text-neutral-500">Phone Number</p>
              <p id="modal-phone" class="text-sm font-semibold text-white truncate"></p>
            </div>
            <a id="modal-wa-link" href="#" target="_blank" class="px-3 py-1.5 bg-emerald-950/30 text-emerald-400 border border-emerald-900/50 rounded-lg text-xs font-bold hover:bg-emerald-900/50 transition"><i class="ti ti-brand-whatsapp mr-1"></i>Chat</a>
          </div>
        </div>

        <div class="space-y-3 pt-2">
          <h4 class="text-[10px] uppercase font-bold text-neutral-500 tracking-wider border-b border-neutral-900 pb-2">Payment Details</h4>
          
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-lg bg-neutral-900 flex items-center justify-center text-purple-400 mt-1"><i class="ti ti-qrcode"></i></div>
            <div class="flex-1 min-w-0">
              <p class="text-[10px] text-neutral-500">UPI ID</p>
              <p id="modal-upi" class="text-sm font-semibold text-white bg-neutral-950 border border-neutral-800 p-2.5 rounded-lg mt-1 break-all"></p>
            </div>
          </div>
          
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-lg bg-neutral-900 flex items-center justify-center text-amber-400 mt-1"><i class="ti ti-building-bank"></i></div>
            <div class="flex-1 min-w-0">
              <p class="text-[10px] text-neutral-500">Bank Account</p>
              <p id="modal-bank" class="text-sm font-semibold text-white bg-neutral-950 border border-neutral-800 p-2.5 rounded-lg mt-1 whitespace-pre-wrap leading-relaxed text-xs"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    const SUPABASE_URL = 'https://smyupcjfusgduaoxqfvu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNteXVwY2pmdXNnZHVhb3hxZnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NjA3MzIsImV4cCI6MjA5NTQzNjczMn0.pGg9ZIYWpZ70R_HNtRl7FHrzeUNA5vlZT6hNkjDzhqo';
    
    const HEADERS = {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Prefer': 'return=representation'
    };

    let currentUser = null;
    let shooters = [];       
    let liveProfiles = {};   

    document.addEventListener('DOMContentLoaded', async () => {
      const savedUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        await loadShooters();
        
        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-overlay').classList.add('hidden');
          document.getElementById('main-content').style.opacity = '1';
        }, 300);
      } else {
        document.body.innerHTML = `<div class="flex flex-col items-center justify-center h-screen bg-[#050505]"><p class="text-sm text-neutral-400">Authentication Required.</p></div>`;
      }
    });

    // CRITICAL FIX: cache: 'no-store' bypasses the Service Worker and forces fresh data
    async function sbFetch(path, opts = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        cache: 'no-store', 
        ...opts,
        headers: { ...HEADERS, ...(opts.headers || {}) }
      });
      if (!res.ok) throw new Error(await res.text());
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    async function loadShooters() {
      try {
        const userId = currentUser.id;
        const key = `${userId}_shooters`;
        const res = await sbFetch(`settings?key=eq.${key}&select=value`);
        
        if (res && res.length > 0) shooters = res[0].value || [];
        
        await fetchLiveProfiles();
        renderShooters();
      } catch (e) {
        console.error(e);
        showToast('Failed to load roster from cloud.', 'error');
      }
    }

    async function fetchLiveProfiles() {
      if (!shooters.length) return;
      try {
         const emails = shooters.map(s => s.email.toLowerCase());
         const profilesArray = await sbFetch('rpc/get_multiple_shooter_profiles', {
            method: 'POST',
            body: JSON.stringify({ lookup_emails: emails })
         });
         
         liveProfiles = {};
         if (Array.isArray(profilesArray)) {
           profilesArray.forEach(p => {
              if (p && p.email) liveProfiles[p.email.toLowerCase()] = p;
           });
         }
      } catch(e) {
         console.error("Error doing dynamic background checks:", e);
      }
    }

    async function checkEmailForProfile() {
       const email = document.getElementById('shooter-email').value.trim().toLowerCase();
       const nameInput = document.getElementById('shooter-name');
       const spinner = document.getElementById('name-spinner');
       
       if (!email || !email.includes('@')) {
          nameInput.value = '';
          nameInput.classList.remove('text-emerald-400', 'text-red-400');
          return;
       }
       
       nameInput.value = 'Verifying live user status...';
       nameInput.classList.remove('text-emerald-400', 'text-red-400');
       spinner.classList.remove('hidden');

       try {
         // Using the array version even for a single check ensures we hit the new optimized logic
         const profileData = await sbFetch('rpc/get_multiple_shooter_profiles', {
            method: 'POST',
            body: JSON.stringify({ lookup_emails: [email] })
         });
         
         if (profileData && profileData.length > 0 && profileData[0].name) {
           nameInput.value = profileData[0].name;
           nameInput.classList.add('text-emerald-400');
         } else {
           nameInput.value = 'User not found in Sakkhi';
           nameInput.classList.add('text-red-400');
         }
       } catch(e) {
         nameInput.value = 'Error connecting to database';
         nameInput.classList.add('text-red-400');
       } finally {
         spinner.classList.add('hidden');
       }
    }

    function handleRoleChange() {
      const roleSelect = document.getElementById('shooter-role');
      const customInput = document.getElementById('custom-role-input');
      if (roleSelect.value === '__custom__') {
        customInput.classList.remove('hidden');
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
      }
    }

    async function addShooter() {
      const emailInput = document.getElementById('shooter-email');
      const nameInput = document.getElementById('shooter-name');
      const roleSelect = document.getElementById('shooter-role');
      const customInput = document.getElementById('custom-role-input');
      
      const email = emailInput.value.trim().toLowerCase();
      const name = nameInput.value;
      
      let role = roleSelect.value;
      if (role === '__custom__') {
        role = customInput.value.trim();
        if (!role) { showToast('Please type a custom role.', 'error'); return; }
      }
      
      if (!email) { showToast('Please enter an account email.', 'error'); return; }
      if (shooters.find(s => s.email.toLowerCase() === email)) { showToast('User already on roster list.', 'error'); return; }
      if (!name || name.includes('not found') || name.includes('Error') || name.includes('Verifying')) {
        showToast('Valid registered account required.', 'error');
        return;
      }
      
      const newShooter = {
        id: 'shtr_' + Date.now().toString(36),
        email: email,
        role: role,
        addedAt: new Date().toISOString()
      };
      
      shooters.unshift(newShooter); 
      
      emailInput.value = ''; 
      nameInput.value = '';
      nameInput.classList.remove('text-emerald-400');
      roleSelect.value = 'Lead Photographer';
      handleRoleChange(); 
      
      updateSyncUI('syncing');
      await fetchLiveProfiles();
      renderShooters();
      await pushToCloud();
      showToast('Team linkage confirmed!', 'success');
    }

    async function deleteShooter(id, name, event) {
      if (event) event.stopPropagation();
      if (!confirm(`Remove ${name} from your team layout?`)) return;
      shooters = shooters.filter(s => s.id !== id);
      renderShooters();
      await pushToCloud();
      showToast('Roster config adjustments saved.', 'info');
    }

    async function pushToCloud() {
      const userId = currentUser.id;
      const uniqueKey = `${userId}_shooters`;
      updateSyncUI('syncing');
      try {
        const checkExisting = await sbFetch(`settings?key=eq.${uniqueKey}&select=key`);
        if (checkExisting && checkExisting.length > 0) {
          await sbFetch(`settings?key=eq.${uniqueKey}`, {
            method: 'PATCH',
            body: JSON.stringify({ value: shooters, user_id: userId }) 
          });
        } else {
          await sbFetch('settings', {
            method: 'POST',
            body: JSON.stringify({ key: uniqueKey, value: shooters, user_id: userId })
          });
        }
        updateSyncUI('synced');
      } catch (e) {
        updateSyncUI('error');
      }
    }

    function renderShooters() {
      const container = document.getElementById('shooters-list');
      const searchQuery = (document.getElementById('roster-search')?.value || '').toLowerCase();
      
      const filteredShooters = shooters.filter(s => {
         const profile = liveProfiles[s.email.toLowerCase()] || {};
         const name = profile.name || s.email.split('@')[0];
         const phone = profile.phone || '';
         return name.toLowerCase().includes(searchQuery) || 
                s.email.toLowerCase().includes(searchQuery) || 
                s.role.toLowerCase().includes(searchQuery) ||
                phone.toLowerCase().includes(searchQuery);
      });

      if (!filteredShooters.length) {
        container.innerHTML = `<div class="text-center py-10 border border-dashed border-neutral-800 rounded-xl bg-neutral-950/30 text-xs text-neutral-500">No active team members matched your filter fields.</div>`;
        return;
      }
      
      container.innerHTML = filteredShooters.map(s => {
        const safeEmail = s.email.toLowerCase();
        const profile = liveProfiles[safeEmail] || {};
        const displayName = profile.name || s.email.split('@')[0];
        const displayPhone = profile.phone && profile.phone !== 'N/A' ? profile.phone : '';

        let roleBadge = 'bg-neutral-900/50 text-neutral-400 border-neutral-800';
        let icon = 'ti-user';
        const roleLower = (s.role || '').toLowerCase();
        if (roleLower.includes('photographer')) { roleBadge = 'bg-blue-950/30 text-blue-400 border-blue-900/50'; icon = 'ti-camera'; }
        else if (roleLower.includes('cinematographer') || roleLower.includes('video')) { roleBadge = 'bg-purple-950/30 text-purple-400 border-purple-900/50'; icon = 'ti-video'; }
        else if (roleLower.includes('drone')) { roleBadge = 'bg-emerald-950/30 text-emerald-400 border-emerald-900/50'; icon = 'ti-drone'; }

        const initials = displayName.substring(0, 2).toUpperCase();

        return `
        <div onclick="openDetailsModal('${safeEmail}', '${s.role}')" class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-neutral-950/80 border border-neutral-900 rounded-xl hover:border-[#c9a96e]/30 hover:bg-[#121212] transition group w-full cursor-pointer gap-4">
          <div class="flex items-center gap-4 min-w-0">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-neutral-900 to-neutral-800 border border-neutral-700 flex items-center justify-center text-white font-bold text-sm shrink-0">
              ${initials}
            </div>
            <div class="min-w-0">
              <p class="text-base font-bold text-white truncate leading-tight">${displayName}</p>
              <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1">
                <span class="inline-flex items-center gap-1 text-[10px] uppercase tracking-wider px-2 py-0.5 rounded border font-bold ${roleBadge}">
                  <i class="ti ${icon} text-xs"></i> ${s.role}
                </span>
                <span class="text-xs text-neutral-400 flex items-center truncate"><i class="ti ti-mail mr-1 text-neutral-600"></i>${s.email}</span>
                ${displayPhone ? `<span class="text-xs text-emerald-400/80 flex items-center truncate"><i class="ti ti-phone mr-1 text-emerald-600"></i>${displayPhone}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-3 self-end sm:self-auto">
            <span class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest sm:hidden group-hover:text-[#c9a96e] transition">View Live Details <i class="ti ti-arrow-right"></i></span>
            <button onclick="deleteShooter('${s.id}', '${displayName}', event)" class="p-2.5 text-neutral-600 hover:text-red-400 hover:bg-red-950/30 rounded-lg md:opacity-0 md:group-hover:opacity-100 transition shrink-0">
              <i class="ti ti-trash text-lg"></i>
            </button>
          </div>
        </div>`;
      }).join('');
    }

    function openDetailsModal(email, role) {
      const profile = liveProfiles[email.toLowerCase()] || { name: email.split('@')[0], phone: 'N/A', upi: 'Not provided', bank: 'Not provided' };

      document.getElementById('modal-initials').textContent = profile.name.substring(0, 2).toUpperCase();
      document.getElementById('modal-name').textContent = profile.name;
      document.getElementById('modal-role').textContent = role;
      document.getElementById('modal-email').textContent = email;
      document.getElementById('modal-phone').textContent = profile.phone;
      document.getElementById('modal-upi').textContent = profile.upi;
      document.getElementById('modal-bank').textContent = profile.bank;
      
      const waBtn = document.getElementById('modal-wa-link');
      if (profile.phone && profile.phone !== 'N/A') {
        waBtn.href = `https://wa.me/${profile.phone.replace(/\D/g, '')}`;
        waBtn.style.display = 'inline-flex';
      } else {
        waBtn.style.display = 'none';
      }

      document.getElementById('details-modal-backdrop').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('details-modal-content').classList.add('modal-anim-active');
    }

    function closeDetailsModal() {
      document.getElementById('details-modal-backdrop').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('details-modal-content').classList.remove('modal-anim-active');
    }

    function updateSyncUI(state) {
      const syncEl = document.getElementById('sync-status');
      if (state === 'syncing') syncEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Syncing...`;
      else if (state === 'synced') syncEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Live`;
      else syncEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Offline`;
    }

    function showToast(msg, type = 'success') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      const colors = type === 'success' ? 'bg-emerald-950/90 border-emerald-900 text-emerald-300' : type === 'info' ? 'bg-blue-950/90 border-blue-900 text-blue-300' : 'bg-red-950/90 border-red-900 text-red-300';
      const icon = type === 'success' ? 'ti-circle-check' : type === 'info' ? 'ti-info-circle' : 'ti-alert-circle';
      t.className = `p-3 text-xs font-semibold rounded-xl flex items-center gap-2 shadow-2xl border backdrop-blur-md transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto ${colors}`;
      t.innerHTML = `<i class="ti ${icon} text-base"></i><span>${msg}</span>`;
      c.appendChild(t);
      requestAnimationFrame(() => t.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 300); }, 3000);
    }
  </script>
</body>
</html>
