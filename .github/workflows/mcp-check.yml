name: Sakkhi MCP checks
on:
  push:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-check.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node --test test/basic.test.js
      - run: npx wrangler deploy --dry-run --outdir /tmp/sakkhi-mcp-build
