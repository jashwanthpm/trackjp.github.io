<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jashwanth JP | Wedding photographer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --transition-smooth: 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdfdfd;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUpIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .font-serif { font-family: 'Playfair Display', serif; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .scroll-container {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory; 
            cursor: grab; 
        }
        
        .scroll-container:active { cursor: grabbing; }
        .snap-item { scroll-snap-align: start; }

        .img-wrapper {
            overflow: hidden;
            background: #eee;
            cursor: pointer;
            position: relative;
        }
        
        .gallery-img {
            transition: transform var(--transition-smooth);
            will-change: transform;
            pointer-events: none;
        }

        .img-wrapper:hover .gallery-img { transform: scale(1.04); }

        #lightbox {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        #lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        #lightbox-img {
            transform: scale(0.95);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        #lightbox.active #lightbox-img {
            transform: scale(1);
        }

        #lightbox-img.fade-out {
            opacity: 0;
            transform: scale(0.98);
        }

        /* Loading Spinner */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Inter', sans-serif;
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="antialiased selection:bg-black selection:text-white">

    <header class="pt-32 pb-14 px-8 md:px-12 w-full max-w-[1800px] mx-auto">
        <h1 class="text-[2rem] md:text-[2.5rem] text-[#111] font-serif font-medium mb-1 tracking-tight leading-none">Hugo Bellamy</h1>
        <p class="text-lg md:text-[1.25rem] text-[#777] font-light tracking-wide">Award-winning photographer</p>
    </header>

    <main class="w-full mb-24 relative select-none min-h-[400px]">
        <div id="loader">Loading Gallery...</div>
        <div id="gallery-track" class="flex overflow-x-auto hide-scrollbar scroll-container gap-5 pl-8 md:pl-12 pr-12 pb-8 opacity-0 transition-opacity duration-500">
            </div>
    </main>

    <footer class="mt-auto px-8 md:px-12 py-10 flex flex-col md:flex-row justify-between items-center text-[12px] md:text-[13px] text-[#999] w-full max-w-[1800px] mx-auto gap-4 border-t border-gray-100">
        <div class="flex space-x-3">
            <a href="#" class="hover:text-black transition-colors duration-300">Privacy Policy</a>
            <span>|</span>
            <a href="#" class="hover:text-black transition-colors duration-300">Accessibility Statement</a>
        </div>
        <div>
            &copy;2026 by Hugo Bellamy. Powered and secured by <a href="#" class="underline hover:text-black transition-colors duration-300">Wix</a>.
        </div>
    </footer>

    <div id="lightbox" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-6 md:p-16">
        <button id="close-lightbox" class="absolute top-6 right-6 md:top-10 md:right-10 text-white/70 hover:text-white transition-colors cursor-pointer z-50 p-2">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <button id="prev-btn" class="absolute left-4 md:left-10 top-1/2 -translate-y-1/2 text-white/50 hover:text-white transition-colors cursor-pointer z-50 p-4">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button id="next-btn" class="absolute right-4 md:right-10 top-1/2 -translate-y-1/2 text-white/50 hover:text-white transition-colors cursor-pointer z-50 p-4">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
        <img id="lightbox-img" src="" alt="Enlarged photography" class="max-w-full max-h-full object-contain shadow-2xl relative z-40">
    </div>

    <script>
        // ==========================================
        // PASTE YOUR GOOGLE SHEET CSV LINK HERE
        // ==========================================
        const sheetUrl = 'YOUR_GOOGLE_SHEET_CSV_LINK_HERE';
        // ==========================================

        let portfolioImages = [];
        
        // --- Core Elements ---
        const slider = document.getElementById('gallery-track');
        const loader = document.getElementById('loader');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightboxBtn = document.getElementById('close-lightbox');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        let isDown = false;
        let startX;
        let scrollLeft;
        let dragDistance = 0;
        let currentIndex = 0; 
        let wrappers = []; 

        // --- Fetch Images from Google Sheet ---
        async function fetchImages() {
            try {
                // If you haven't put a real link in yet, load some fallback images so the site doesn't look broken
                if(sheetUrl === 'YOUR_GOOGLE_SHEET_CSV_LINK_HERE') {
                    portfolioImages = [
                        { thumb: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=800&fit=crop", highRes: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=100&w=2000", alt: "Demo" },
                        { thumb: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=800&fit=crop", highRes: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=100&w=2000", alt: "Demo" }
                    ];
                } else {
                    const response = await fetch(sheetUrl);
                    const data = await response.text();
                    
                    // Parse CSV data
                    const rows = data.split('\\n').slice(1); // Remove header row
                    portfolioImages = rows.map(row => {
                        // Split by comma, handling potential quotes
                        const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                        if(cols.length >= 2 && cols[0].trim() !== "") {
                            return {
                                thumb: cols[0].replace(/"/g, '').trim(),
                                highRes: cols[1].replace(/"/g, '').trim(),
                                alt: cols[2] ? cols[2].replace(/"/g, '').trim() : "Portfolio Image"
                            };
                        }
                    }).filter(Boolean); // Remove empty rows
                }
                
                renderGallery();
            } catch (error) {
                loader.innerText = "Error loading gallery. Check your Google Sheet link.";
                console.error(error);
            }
        }

        // --- Render Gallery Function ---
        const renderGallery = () => {
            slider.innerHTML = ''; // Clear track
            
            portfolioImages.forEach((imgData, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'snap-item flex-none w-[240px] md:w-[300px] lg:w-[340px] aspect-[3/4] img-wrapper';
                wrapper.setAttribute('data-src', imgData.highRes);
                
                wrapper.innerHTML = `
                    <img src="${imgData.thumb}" alt="${imgData.alt}" class="gallery-img w-full h-full object-cover shadow-sm" draggable="false">
                `;

                wrapper.addEventListener('click', () => {
                    if (dragDistance > 5) return; 
                    currentIndex = index;
                    updateLightboxImage(currentIndex);
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden'; 
                });

                slider.appendChild(wrapper);
                wrappers.push(wrapper);
            });

            const endPadding = document.createElement('div');
            endPadding.className = 'flex-none w-[4px] md:w-[40px]';
            slider.appendChild(endPadding);

            // Hide loader and show gallery
            loader.style.display = 'none';
            slider.classList.remove('opacity-0');
        };


        // --- Drag to Scroll Logic ---
        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            dragDistance = 0;
            slider.style.scrollSnapType = 'none'; 
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });

        slider.addEventListener('mouseleave', () => {
            isDown = false;
            slider.style.scrollSnapType = 'x mandatory';
        });

        slider.addEventListener('mouseup', () => {
            isDown = false;
            slider.style.scrollSnapType = 'x mandatory';
        });

        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; 
            slider.scrollLeft = scrollLeft - walk;
            dragDistance = Math.abs(x - startX);
        });

        // --- Lightbox Logic ---
        const updateLightboxImage = (index) => {
            lightboxImg.classList.add('fade-out');
            setTimeout(() => {
                lightboxImg.src = portfolioImages[index].highRes;
                lightboxImg.alt = portfolioImages[index].alt;
                lightboxImg.onload = () => lightboxImg.classList.remove('fade-out');
            }, 150); 
        };

        const showNextImage = (e) => {
            if (e) e.stopPropagation(); 
            currentIndex = (currentIndex + 1) % portfolioImages.length; 
            updateLightboxImage(currentIndex);
        };

        const showPrevImage = (e) => {
            if (e) e.stopPropagation(); 
            currentIndex = (currentIndex - 1 + portfolioImages.length) % portfolioImages.length; 
            updateLightboxImage(currentIndex);
        };

        nextBtn.addEventListener('click', showNextImage);
        prevBtn.addEventListener('click', showPrevImage);

        const closeLightbox = () => {
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; 
            setTimeout(() => {
                lightboxImg.src = '';
                lightboxImg.classList.remove('fade-out');
            }, 500); 
        };

        closeLightboxBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') showNextImage();
            if (e.key === 'ArrowLeft') showPrevImage();
        });

        // Kick off the script
        fetchImages();

    </script>
</body>
</html>
