<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakkhi | Active Pipelines</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0a0a;color:#e8e8e8}
    ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#c9a96e}
    .panel{background:#0f0f0f;border:1px solid #202020;border-radius:14px}
    .eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#777}
    .field{width:100%;background:#090909;border:1px solid #292929;border-radius:9px;padding:10px 12px;color:#eee;font-size:13px;outline:none}
    .field:focus{border-color:rgba(201,169,110,.65)}
    .muted{color:#858585}
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
  <main class="max-w-5xl mx-auto space-y-6">
    <header class="flex items-center justify-between border-b border-neutral-900 pb-4">
      <div>
        <h2 class="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
          <i class="ti ti-route text-[#c9a96e]"></i> Active Pipelines
        </h2>
        <p class="text-xs text-neutral-500 mt-1">Track each production from confirmed booking through delivery.</p>
      </div>
      
    </header>
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4"><div class="panel p-4 min-h-64"><div class="flex items-center justify-between"><h2 class="font-bold text-white">Upcoming</h2><i class="ti ti-calendar text-[#c9a96e] text-lg"></i></div><p class="text-xs text-neutral-500 mt-1">Bookings and shoots not started</p><div class="mt-5 border border-dashed border-neutral-800 rounded-xl p-6 text-center"><i class="ti ti-layout-kanban text-2xl text-neutral-700"></i><p class="text-xs text-neutral-500 mt-2">No pipeline items yet</p></div></div><div class="panel p-4 min-h-64"><div class="flex items-center justify-between"><h2 class="font-bold text-white">In Production</h2><i class="ti ti-video text-[#c9a96e] text-lg"></i></div><p class="text-xs text-neutral-500 mt-1">Active shoots and editing</p><div class="mt-5 border border-dashed border-neutral-800 rounded-xl p-6 text-center"><i class="ti ti-layout-kanban text-2xl text-neutral-700"></i><p class="text-xs text-neutral-500 mt-2">No pipeline items yet</p></div></div><div class="panel p-4 min-h-64"><div class="flex items-center justify-between"><h2 class="font-bold text-white">Ready to Deliver</h2><i class="ti ti-checks text-[#c9a96e] text-lg"></i></div><p class="text-xs text-neutral-500 mt-1">Final checks and client delivery</p><div class="mt-5 border border-dashed border-neutral-800 rounded-xl p-6 text-center"><i class="ti ti-layout-kanban text-2xl text-neutral-700"></i><p class="text-xs text-neutral-500 mt-2">No pipeline items yet</p></div></div></section>
  </main>
</body>
</html>
