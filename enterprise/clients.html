<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sakkhi | Studio Clients</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"><style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0a0a;color:#e8e8e8}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:8px}
.panel{background:#0f0f0f;border:1px solid #202020;border-radius:12px}
.field{width:100%;background:#090909;border:1px solid #292929;border-radius:8px;padding:9px 11px;color:#eee;font-size:12px;outline:none}
.field:focus{border-color:rgba(201,169,110,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;transition:.15s}
.btn-gold{background:#c9a96e;color:#090909}.btn-gold:hover{background:#e0c184}
.btn-ghost{border:1px solid #303030;color:#d4d4d4}.btn-ghost:hover{border-color:#c9a96e;color:#c9a96e}
.eyebrow{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#777}
.muted{color:#858585}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#777;font-weight:800;border-bottom:1px solid #252525;padding:10px 12px}td{font-size:12px;color:#ddd;border-bottom:1px solid #1e1e1e;padding:11px 12px;vertical-align:middle}
.badge{display:inline-flex;align-items:center;border:1px solid #333;border-radius:999px;padding:3px 8px;font-size:10px;color:#aaa}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:#151515;border:1px solid #333;padding:10px 14px;border-radius:10px;font-size:12px;box-shadow:0 10px 30px #0008}
</style></head>
<body class="min-h-screen p-3 sm:p-5"><main class="max-w-5xl mx-auto space-y-4">
<header class="flex items-center justify-between border-b border-neutral-900 pb-3"><div><h2 class="text-lg md:text-xl font-bold text-white flex items-center gap-2"><i class="ti ti-building text-[#c9a96e]"></i> Studio Clients</h2><p class="text-[11px] text-neutral-500 mt-1">Keep client contacts and production-house details in one searchable directory.</p></div><span id="sync-pill" class="badge"><span class="w-1.5 h-1.5 rounded-full bg-neutral-500 mr-1.5"></span>Workspace</span></header>

<section class="panel p-4"><div class="flex items-center justify-between gap-2 mb-3"><div><h3 class="text-sm font-bold">Client directory</h3><p class="text-[10px] text-neutral-500 mt-1">Saved to your Sakkhi workspace.</p></div><button id="add-client" class="btn btn-gold"><i class="ti ti-plus"></i> Add client</button></div><div id="client-form-panel" class="hidden border border-neutral-800 rounded-lg p-3 mb-4"><form id="client-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"><input id="client-id" type="hidden"><label class="text-[10px] text-neutral-500">Client / studio name *<input id="client-name" required class="field mt-1" placeholder="Studio or client"></label><label class="text-[10px] text-neutral-500">Contact person<input id="client-contact" class="field mt-1" placeholder="Full name"></label><label class="text-[10px] text-neutral-500">Email<input id="client-email" type="email" class="field mt-1" placeholder="name@example.com"></label><label class="text-[10px] text-neutral-500">Phone / WhatsApp<input id="client-phone" class="field mt-1" placeholder="+91…"></label><label class="text-[10px] text-neutral-500">City / location<input id="client-location" class="field mt-1" placeholder="Bengaluru"></label><label class="text-[10px] text-neutral-500">Client type<select id="client-type" class="field mt-1"><option>Production house</option><option>Direct client</option><option>Agency</option><option>Venue</option><option>Other</option></select></label><label class="text-[10px] text-neutral-500 sm:col-span-2 lg:col-span-3">Notes<textarea id="client-notes" rows="2" class="field mt-1" placeholder="Preferences, payment terms, follow-ups…"></textarea></label><div class="sm:col-span-2 lg:col-span-3 flex gap-2"><button class="btn btn-gold" type="submit">Save client</button><button id="cancel-client" class="btn btn-ghost" type="button">Cancel</button></div></form></div><input id="client-search" class="field" placeholder="Search name, contact, email, phone, city…"><div class="table-wrap mt-3"><table><thead><tr><th>Client</th><th>Contact</th><th>Type / City</th><th>Notes</th><th></th></tr></thead><tbody id="client-rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main><script>
const DB_URL='https://smyupcjfusgduaoxqfvu.supabase.co';
const DB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNteXVwY2pmdXNnZHVhb3hxZnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NjA3MzIsImV4cCI6MjA5NTQzNjczMn0.pGg9ZIYWpZ70R_HNtRl7FHrzeUNA5vlZT6hNkjDzhqo';
function currentUser(){try{return JSON.parse(localStorage.getItem('currentUser')||sessionStorage.getItem('currentUser')||'null')}catch(e){return null}}
function sessionToken(){
 const u=currentUser(); if(u&&(u.access_token||u.accessToken))return u.access_token||u.accessToken;
 for(const store of [localStorage,sessionStorage]){
  for(let i=0;i<store.length;i++){const k=store.key(i);if(!k||!k.startsWith('sb-')||!k.endsWith('-auth-token'))continue;
   try{const v=JSON.parse(store.getItem(k));if(v&&v.access_token)return v.access_token;if(v&&v.currentSession&&v.currentSession.access_token)return v.currentSession.access_token}catch(e){}
  }
 }
 return null;
}
function userId(){const u=currentUser();return u&&(u.id||u.user_id)}
function authHeaders(extra){const t=sessionToken();return Object.assign({'apikey':DB_KEY,'Authorization':'Bearer '+(t||DB_KEY),'Content-Type':'application/json'},extra||{})}
async function api(path,opts){
 if(!currentUser()||!userId())throw new Error('Please sign in to Sakkhi again before using Enterprise.');
 if(!sessionToken())throw new Error('Your secure Supabase session was not found. Sign out and sign in again, then retry.');
 const res=await fetch(DB_URL+'/rest/v1/'+path,Object.assign({cache:'no-store',headers:authHeaders()},opts||{}));
 const txt=await res.text();if(!res.ok)throw new Error(txt||('Request failed ('+res.status+')'));return txt?JSON.parse(txt):null;
}
function enc(v){return encodeURIComponent(String(v==null?'':v))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(v)||0)}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
async function getSetting(suffix, fallback){
 const key=userId()+'_'+suffix;const rows=await api('settings?key=eq.'+enc(key)+'&select=value');
 return rows&&rows.length?rows[0].value:fallback;
}
async function setSetting(suffix,value){
 const id=userId(),key=id+'_'+suffix;
 await api('settings?on_conflict=key%2Cuser_id',{method:'POST',headers:authHeaders({'Prefer':'resolution=merge-duplicates,return=representation'}),body:JSON.stringify({key:key,user_id:id,value:value})});
}
function requireUser(){if(!currentUser()||!userId()){document.body.innerHTML='<div class="min-h-screen flex items-center justify-center p-6"><div class="panel p-6 max-w-sm text-center"><h2 class="font-bold text-white">Sign in required</h2><p class="text-sm text-neutral-400 mt-2">Please sign in to Sakkhi and reopen Enterprise.</p><a class="btn btn-gold mt-4" href="/">Go to Sakkhi</a></div></div>';return false}if(!sessionToken()){document.body.innerHTML='<div class="min-h-screen flex items-center justify-center p-6"><div class="panel p-6 max-w-sm text-center"><h2 class="font-bold text-white">Session refresh needed</h2><p class="text-sm text-neutral-400 mt-2">A secure Supabase session is needed to save changes. Sign out and sign in again, then reopen Enterprise.</p><a class="btn btn-gold mt-4" href="/">Go to Sakkhi</a></div></div>';return false}return true}


let clients=[];
function resetForm(){document.getElementById('client-form').reset();document.getElementById('client-id').value='';document.getElementById('client-form-panel').classList.add('hidden')}
function render(){const q=document.getElementById('client-search').value.toLowerCase();const list=clients.filter(c=>(c.name+' '+c.contact+' '+c.email+' '+c.phone+' '+c.location+' '+c.type).toLowerCase().includes(q));document.getElementById('client-rows').innerHTML=list.length?list.map(c=>'<tr><td><p class="font-semibold">'+esc(c.name)+'</p><p class="text-[10px] text-neutral-500">'+esc(c.contact||'')+'</p></td><td><p>'+esc(c.email||'—')+'</p><p class="text-[10px] text-neutral-500">'+esc(c.phone||'')+'</p></td><td>'+esc(c.type||'Other')+'<p class="text-[10px] text-neutral-500">'+esc(c.location||'')+'</p></td><td class="max-w-48">'+esc(c.notes||'—')+'</td><td><div class="flex gap-1"><button class="btn btn-ghost" data-edit="'+esc(c.id)+'">Edit</button><button class="btn btn-ghost" data-del="'+esc(c.id)+'">×</button></div></td></tr>').join(''):'<tr><td colspan="5" class="text-center py-8 text-neutral-500">No clients found. Add your first client above.</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const c=clients.find(x=>x.id===b.dataset.edit);document.getElementById('client-form-panel').classList.remove('hidden');['id','name','contact','email','phone','location','type','notes'].forEach(k=>{const el=document.getElementById('client-'+k);if(el)el.value=c[k]||''})});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this client?'))return;clients=clients.filter(c=>c.id!==b.dataset.del);try{await setSetting('enterprise_clients',clients);render();toast('Client deleted')}catch(e){toast('Delete failed: '+e.message)}})}
async function load(){if(!requireUser())return;try{clients=await getSetting('enterprise_clients',[]);render()}catch(e){toast('Could not load clients: '+e.message)}}document.getElementById('add-client').onclick=()=>{resetForm();document.getElementById('client-form-panel').classList.remove('hidden')};document.getElementById('cancel-client').onclick=resetForm;document.getElementById('client-search').oninput=render;document.getElementById('client-form').onsubmit=async e=>{e.preventDefault();const id=document.getElementById('client-id').value;const c={id:id||'cl_'+Date.now().toString(36),name:document.getElementById('client-name').value.trim(),contact:document.getElementById('client-contact').value.trim(),email:document.getElementById('client-email').value.trim(),phone:document.getElementById('client-phone').value.trim(),location:document.getElementById('client-location').value.trim(),type:document.getElementById('client-type').value,notes:document.getElementById('client-notes').value.trim(),updatedAt:new Date().toISOString()};if(!c.name)return;clients=id?clients.map(x=>x.id===id?c:x):[c,...clients];try{await setSetting('enterprise_clients',clients);resetForm();render();toast('Client saved')}catch(err){toast('Save failed: '+err.message)}};load();</script></body></html>
