<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/ent.css">
</head>
<body class="ent">
<div class="max-w-6xl mx-auto px-4 sm:px-8 py-7">
  <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
    <div>
      <h1 class="e-h1" id="hello">Overview</h1>
      <p class="e-sub mt-1" id="sub">A live view of enquiries, bookings and money for your company.</p>
    </div>
    <div class="flex gap-2">
      <button class="e-btn" id="b-form"><i class="ti ti-forms"></i> Enquiry form</button>
      <button class="e-btn primary" id="b-lead"><i class="ti ti-plus"></i> Add lead</button>
    </div>
  </div>

  <div id="setup" class="e-card p-5 mb-5 hidden"></div>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5" id="kpis">
    <div class="e-card p-4 e-skel" style="height:104px"></div><div class="e-card p-4 e-skel" style="height:104px"></div>
    <div class="e-card p-4 e-skel" style="height:104px"></div><div class="e-card p-4 e-skel" style="height:104px"></div>
  </div>

  <div class="grid lg:grid-cols-3 gap-4">
    <section class="e-card lg:col-span-2">
      <div class="flex items-center justify-between px-5 pt-4"><h2 class="text-sm font-bold text-white">Recent enquiries</h2><button class="e-btn sm" data-go="leads.html">View all</button></div>
      <div id="recent" class="p-2"></div>
    </section>
    <section class="e-card">
      <div class="px-5 pt-4"><h2 class="text-sm font-bold text-white">Pipeline</h2><p class="e-sub">Where your leads are right now</p></div>
      <div id="funnel" class="p-5 space-y-3"></div>
    </section>
    <section class="e-card">
      <div class="px-5 pt-4"><h2 class="text-sm font-bold text-white">Follow-ups due</h2><p class="e-sub">People waiting to hear from you</p></div>
      <div id="followups" class="p-2"></div>
    </section>
    <section class="e-card">
      <div class="px-5 pt-4"><h2 class="text-sm font-bold text-white">Upcoming events</h2><p class="e-sub">Booked (won) enquiries</p></div>
      <div id="events" class="p-2"></div>
    </section>
    <section class="e-card">
      <div class="flex items-center justify-between px-5 pt-4"><div><h2 class="text-sm font-bold text-white">Overdue invoices</h2><p class="e-sub">Past their due date</p></div><button class="e-btn sm" data-go="invoices.html">Invoices</button></div>
      <div id="overdue" class="p-2"></div>
    </section>
  </div>
</div>
<script src="assets/ent.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const go = p => { try { parent.ENT_SHELL.go(p); } catch (e) { location.href = p; } };
  document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
  const ctx = await ENT.init(), W = ctx.ws.id, cur = ctx.ws.currency;
  const first = (ctx.user.name || '').split(' ')[0];
  const hr = new Date().getHours();
  $('hello').textContent = (hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening') + (first ? ', ' + first : '');
  $('sub').textContent = ctx.ws.name + ' · live overview';
  $('b-lead').onclick = () => go('leads.html?new=1');
  $('b-form').onclick = () => go('forms.html');

  const row = (title, sub, right, page) => '<button data-go="' + ENT.esc(page) + '" class="w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-[#101010]"><span class="min-w-0 flex-1"><span class="block text-[13px] font-semibold text-white truncate">' + ENT.esc(title) + '</span><span class="block text-[11px] text-[#8a8a8a] truncate">' + ENT.esc(sub) + '</span></span>' + (right || '') + '</button>';
  const empty = (icon, msg) => '<div class="e-empty"><i class="ti ' + icon + '"></i>' + msg + '</div>';
  const badge = s => '<span class="e-badge ' + s + '">' + s.replace('_', ' ') + '</span>';

  try {
    const [leads, invoices, forms, members] = await Promise.all([
      ENT.sb('enterprise_leads?workspace_id=eq.' + W + '&select=id,contact_name,event_type,event_date,budget,status,created_at,follow_up_at,source&order=created_at.desc&limit=1000'),
      ENT.sb('enterprise_invoices?workspace_id=eq.' + W + '&select=id,invoice_number,status,total,amount_paid,due_date&limit=1000'),
      ENT.sb('enterprise_inquiry_forms?workspace_id=eq.' + W + '&select=id&limit=1'),
      ENT.sb('enterprise_workspace_members?workspace_id=eq.' + W + '&select=id&limit=50')
    ]);
    const L = leads || [], I = invoices || [], today = ENT.todayStr(), now = Date.now();
    const weekAgo = now - 7 * 864e5, monthStart = today.slice(0, 8) + '01';
    const open = L.filter(l => !['won', 'lost'].includes(l.status));
    const sum = (a, f) => a.reduce((t, x) => t + (Number(f(x)) || 0), 0);
    const owing = I.filter(i => ['issued', 'part_paid', 'overdue'].includes(i.status));
    const outstanding = sum(owing, i => i.total - i.amount_paid);
    const won = L.filter(l => l.status === 'won' && (l.created_at || '').slice(0, 10) >= monthStart);
    const kpi = (label, val, note, icon) => '<div class="e-card e-kpi p-4"><div class="flex items-center justify-between"><span class="e-sub font-semibold">' + label + '</span><i class="ti ' + icon + ' text-[#c9a96e]"></i></div><div class="v mt-2">' + val + '</div><div class="e-sub mt-1">' + note + '</div></div>';
    $('kpis').innerHTML =
      kpi('New enquiries', L.filter(l => new Date(l.created_at) >= weekAgo).length, 'in the last 7 days', 'ti-user-plus') +
      kpi('Open pipeline', ENT.money(sum(open, l => l.budget), cur), open.length + ' active lead' + (open.length === 1 ? '' : 's'), 'ti-chart-funnel') +
      kpi('Won this month', won.length, ENT.money(sum(won, l => l.budget), cur) + ' in bookings', 'ti-trophy') +
      kpi('Outstanding', ENT.money(outstanding, cur), owing.length + ' unpaid invoice' + (owing.length === 1 ? '' : 's'), 'ti-wallet');

    // setup checklist: shown until the basics are done
    const steps = [
      ['Add your company phone & address', !!(ctx.ws.phone && ctx.ws.address), 'account.html', 'ti-building-store'],
      ['Share your enquiry form', (forms || []).length > 0, 'forms.html', 'ti-forms'],
      ['Add or receive your first lead', L.length > 0, 'leads.html?new=1', 'ti-user-plus'],
      ['Invite a team member', (members || []).length > 1, 'team.html', 'ti-users']
    ];
    const doneN = steps.filter(s => s[1]).length;
    if (doneN < steps.length) {
      $('setup').classList.remove('hidden');
      $('setup').innerHTML = '<div class="flex items-center justify-between mb-3"><div><h2 class="text-sm font-bold text-white">Get your company set up</h2><p class="e-sub">' + doneN + ' of ' + steps.length + ' done</p></div><div class="w-32 h-1.5 rounded-full bg-[#161616] overflow-hidden"><div style="width:' + (doneN / steps.length * 100) + '%" class="h-full bg-[#c9a96e]"></div></div></div><div class="grid sm:grid-cols-2 gap-2">' +
        steps.map(s => '<button data-go="' + s[2] + '" class="flex items-center gap-3 p-3 rounded-xl border border-[#1a1a1a] hover:border-[#2c2c2c] text-left"><span class="w-8 h-8 rounded-lg flex items-center justify-center ' + (s[1] ? 'bg-[rgba(74,222,128,.1)] text-[#4ade80]' : 'bg-[#111] text-[#c9a96e]') + '"><i class="ti ' + (s[1] ? 'ti-check' : s[3]) + '"></i></span><span class="text-[13px] ' + (s[1] ? 'text-[#737373] line-through' : 'text-white font-semibold') + '">' + s[0] + '</span></button>').join('') + '</div>';
    }

    $('recent').innerHTML = L.length ? L.slice(0, 6).map(l => row(l.contact_name || 'Unnamed', [l.event_type, l.event_date ? ENT.dayShort(l.event_date) : '', l.source].filter(Boolean).join(' · '), badge(l.status) + '<span class="text-[10px] text-[#525252] w-14 text-right">' + ENT.ago(l.created_at) + '</span>', 'leads.html?id=' + l.id)).join('') : empty('ti-inbox', 'No enquiries yet. Share your enquiry form to start receiving them.');

    const stages = ['new', 'contacted', 'qualified', 'quoted', 'won', 'lost'], max = Math.max(1, ...stages.map(s => L.filter(l => l.status === s).length));
    $('funnel').innerHTML = stages.map(s => { const n = L.filter(l => l.status === s).length; return '<div><div class="flex justify-between text-[12px] mb-1"><span class="text-[#d4d4d4] capitalize">' + s + '</span><span class="font-bold text-white">' + n + '</span></div><div class="h-1.5 rounded-full bg-[#141414] overflow-hidden"><div class="h-full rounded-full ' + (s === 'lost' ? 'bg-[#f87171]' : s === 'won' ? 'bg-[#4ade80]' : 'bg-[#c9a96e]') + '" style="width:' + (n / max * 100) + '%"></div></div></div>'; }).join('');

    const fu = open.filter(l => l.follow_up_at && new Date(l.follow_up_at) <= new Date(now + 864e5)).sort((a, b) => new Date(a.follow_up_at) - new Date(b.follow_up_at)).slice(0, 5);
    $('followups').innerHTML = fu.length ? fu.map(l => row(l.contact_name || 'Unnamed', (new Date(l.follow_up_at) < now ? 'Overdue ' : 'Due ') + ENT.ago(l.follow_up_at).replace(' ago', ''), '<i class="ti ti-phone-call text-[#c9a96e]"></i>', 'leads.html?id=' + l.id)).join('') : empty('ti-circle-check', 'No follow-ups waiting.');

    const ev = L.filter(l => l.status === 'won' && l.event_date && l.event_date >= today).sort((a, b) => a.event_date.localeCompare(b.event_date)).slice(0, 5);
    $('events').innerHTML = ev.length ? ev.map(l => row(l.contact_name || 'Unnamed', l.event_type || 'Event', '<span class="text-[11px] font-bold text-[#c9a96e]">' + ENT.dayShort(l.event_date) + '</span>', 'leads.html?id=' + l.id)).join('') : empty('ti-calendar-event', 'No upcoming booked events.');

    const od = owing.filter(i => i.due_date && i.due_date < today).sort((a, b) => a.due_date.localeCompare(b.due_date)).slice(0, 5);
    $('overdue').innerHTML = od.length ? od.map(i => row(i.invoice_number, 'Due ' + ENT.dayShort(i.due_date), '<span class="text-[12px] font-bold text-[#f87171]">' + ENT.money(i.total - i.amount_paid, cur) + '</span>', 'invoices.html')).join('') : empty('ti-circle-check', 'Nothing overdue. Nice.');
  } catch (e) {
    $('kpis').innerHTML = '<div class="e-card p-5 col-span-full text-[13px]" style="color:var(--bad)">Could not load the overview: ' + ENT.esc(e.message) + '</div>';
  }
})();
</script>
</body>
</html>
